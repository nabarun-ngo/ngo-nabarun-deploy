name: Decide Release Deployment
description: >
  Match a Release-Created event to a manifest and decide whether to deploy.
  - prerelease tag for a Google App Engine manifest → deploy to stage
  - stable tag → skip; production stays manual
  - unknown repository or non-GAE manifest → skip
  Fails on malformed input, a prerelease flag that disagrees with the tag,
  or several manifests sharing one repository.

inputs:
  repository:
    description: Application repository in owner/name format.
    required: true
  tag_name:
    description: Bare semver tag, for example '1.4.0' or '1.4.0-beta.1'.
    required: true
  prerelease:
    description: '"true" or "false"; must agree with tag_name.'
    required: false
    default: 'false'
  ref:
    description: Branch the release was created from. Logged only.
    required: false
    default: ''
  manifests_dir:
    description: Directory containing manifest JSON files, relative to the workspace.
    required: false
    default: config/manifests

outputs:
  action:
    description: '"deploy" or "skip".'
    value: ${{ steps.decide.outputs.action }}
  manifest_name:
    description: Matched manifest name; empty when no manifest matched.
    value: ${{ steps.decide.outputs.manifest_name }}
  tag_name:
    description: Tag to deploy.
    value: ${{ steps.decide.outputs.tag_name }}
  reason:
    description: Human-readable reason for the decision.
    value: ${{ steps.decide.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Match release to a manifest
      id: decide
      shell: bash
      env:
        PAYLOAD_REPOSITORY: ${{ inputs.repository }}
        PAYLOAD_TAG: ${{ inputs.tag_name }}
        PAYLOAD_PRERELEASE: ${{ inputs.prerelease }}
        PAYLOAD_REF: ${{ inputs.ref }}
        MANIFESTS_DIR: ${{ inputs.manifests_dir }}
      run: bash "$GITHUB_ACTION_PATH/decide-release-deployment.sh"
