name: Resolve Git Ref
description: >
  Resolve the effective git ref (tag or branch) for a deployment.
  When tag_name is explicitly provided, returns it unchanged.
  When tag_name is 'latest' or empty, queries the source repository
  and returns the highest semver tag reachable from target_branch.
  - stage branch → latest pre-release (beta) tag on the branch named by the manifest, normally develop
  - main branch  → latest stable tag

inputs:
  tag_name:
    description: >
      Explicit tag to deploy (e.g. '1.2.3', 'v1.2.3', '1.2.3-beta.4').
      Pass 'latest' or leave empty to trigger auto-resolution.
    required: false
    default: 'latest'
  target_branch:
    description: >
      Logical target branch used to determine which tag stream to pick.
      'develop' → beta tags, 'main' → stable tags. The stage deployment environment selects develop.
    required: true
  repository:
    description: Source repository in org/repo format.
    required: true
  github_token:
    description: GitHub token with read access to the source repository.
    required: true

outputs:
  ref:
    description: Resolved git ref ready for checkout.
    value: ${{ steps.resolve.outputs.ref }}
  is_latest:
    description: '"true" if auto-resolution was used; "false" if explicit tag was provided.'
    value: ${{ steps.resolve.outputs.is_latest }}
  tag_stream:
    description: '"stable" or "beta" — indicates which tag stream was resolved.'
    value: ${{ steps.resolve.outputs.tag_stream }}

runs:
  using: composite
  steps:
    - name: Resolve effective ref
      id: resolve
      shell: bash
      env:
        TAG_NAME: ${{ inputs.tag_name }}
        TARGET_BRANCH: ${{ inputs.target_branch }}
        REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: bash "$GITHUB_ACTION_PATH/resolve-git-ref.sh"

    - name: Write step summary
      shell: bash
      run: |
        echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Repository | \`${{ inputs.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Target branch | \`${{ inputs.target_branch }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Resolved ref | \`${{ steps.resolve.outputs.ref }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Tag stream | \`${{ steps.resolve.outputs.tag_stream }}\` |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Auto-resolved | ${{ steps.resolve.outputs.is_latest }} |" >> "$GITHUB_STEP_SUMMARY"
