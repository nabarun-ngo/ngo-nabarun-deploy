name: Upload npm Logs
description: Collect and upload npm debug logs and environment diagnostics

inputs:
  artifact-name:
    description: Name of the uploaded artifact
    required: false
    default: npm-logs
  retention-days:
    description: Number of days to retain the artifact
    required: false
    default: "14"

runs:
  using: composite
  steps:
    - name: Collect npm diagnostics
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/collect-diagnostics.sh"

    - name: Upload npm logs
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/npm-debug/**
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
