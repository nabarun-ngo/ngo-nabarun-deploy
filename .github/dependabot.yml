version: 2
updates:
  # Keep GitHub Actions pinned to major versions up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - github-actions
    groups:
      google-github-actions:
        patterns:
          - "google-github-actions/*"
      actions-core:
        patterns:
          - "actions/*"
