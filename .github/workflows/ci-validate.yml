name: CI — Validate

# Runs on every PR and push to main.
# Validates:
#   1. All manifests in config/manifests/ against schemas/manifest.v1.schema.json
#   2. Schedule JSON in config/schedules/ against schemas/schedules.v1.schema.json
#   3. Workflow YAML syntax (basic check via actionlint if available)
#   4. Shell script lint (shellcheck on scripts/)

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'config/manifests/**'
      - 'config/schedules/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'

  push:
    branches: [main, master]
    paths:
      - 'config/manifests/**'
      - 'config/schedules/**'
      - 'schemas/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-manifests:
    name: Validate manifests
    runs-on: ubuntu-latest

    steps:
      - name: Log run context
        run: |
          echo "::notice::Validate manifests event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA:0:7}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate workflow guardrails
        run: |
          python3 scripts/test_workflow_guardrails.py
          python3 scripts/test_release_model.py
          python3 scripts/validate-workflow-guardrails.py

      - name: Install jq and check-jsonschema
        run: |
          jq --version
          pip install check-jsonschema --quiet
          check-jsonschema --version
          echo "::notice::jq and check-jsonschema available"

      - name: Validate all manifests
        id: validate
        run: |
          set -euo pipefail
          chmod +x scripts/validate-manifests.sh
          scripts/validate-manifests.sh config/manifests/ schemas/manifest.v1.schema.json
          echo "::notice::Manifest validation passed"
          echo "### Manifests" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation passed for \`config/manifests/\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate schedule files
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(config/schedules/*.json)
          if (( ${#files[@]} == 0 )); then
            echo "::notice::No schedule JSON files"
            exit 0
          fi
          for f in "${files[@]}"; do
            check-jsonschema --schemafile schemas/schedules.v1.schema.json "$f"
            echo "::notice::Validated $f"
          done
          echo "### Schedules" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation passed for \`config/schedules/\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Write PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Manifest validation failed.** Check the [CI logs](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for details.\n\nRun `scripts/validate-manifests.sh config/manifests/ schemas/manifest.v1.schema.json` locally to debug.'
            })

  lint-workflows:
    name: Lint workflow YAML
    runs-on: ubuntu-latest

    steps:
      - name: Log run context
        run: echo "::notice::Lint workflows event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
            | bash -s -- 1.7.7 /usr/local/bin
          actionlint --version

      - name: Lint GitHub Actions workflows
        run: actionlint -color .github/workflows/*.yml

  lint-scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Log run context
        run: echo "::notice::Lint scripts event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: Run shellcheck on scripts
        run: |
          find scripts/ .github/actions/ -name '*.sh' -print0 \
            | xargs -0 --no-run-if-empty shellcheck --severity=warning
