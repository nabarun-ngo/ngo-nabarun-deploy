name: Ops — Deploy Frontend (Firebase)

# Manual deploy of one frontend manifest, plus the biweekly public-site stage deploy.
# An application release does not start this workflow.
# Manual stage and prod runs require reviewers; the schedule uses stage-scheduled.

on:
  schedule:
    # 1st and 15th of each month at 02:00 UTC
    - cron: '0 2 1,15 * *'

  workflow_dispatch:
    inputs:
      manifest_name:
        description: 'Frontend manifest'
        required: true
        type: choice
        options:
          - fe-internal-app
          - fe-public-site
      target_environment:
        description: 'Deploy target. Stage and prod both wait for environment approval.'
        required: true
        type: choice
        options:
          - stage
          - prod
      tag_name:
        description: 'Tag to deploy (leave blank or "latest" to auto-resolve)'
        required: false
        default: 'latest'

permissions:
  contents: read
  id-token: write

jobs:
  context:
    name: Setup context
    uses: ./.github/workflows/reusable-setup-context.yml
    with:
      manifest_name: ${{ github.event_name == 'schedule' && 'fe-public-site' || inputs.manifest_name }}
      target_environment: ${{ github.event_name == 'schedule' && 'stage' || inputs.target_environment }}
      tag_name: ${{ github.event_name == 'schedule' && 'latest' || inputs.tag_name }}
      workflow_type: deploy

  manifest:
    name: Resolve manifest
    needs: context
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.resolve.outputs.app_name }}
      repository: ${{ steps.resolve.outputs.repository }}
      build_root: ${{ steps.resolve.outputs.build_root }}
      app_root: ${{ steps.resolve.outputs.app_root }}
      node_version: ${{ steps.resolve.outputs.node_version }}
      install_command: ${{ steps.resolve.outputs.install_command }}
      build_command: ${{ steps.resolve.outputs.build_command }}
      output_path: ${{ steps.resolve.outputs.output_path }}
      platform: ${{ steps.resolve.outputs.platform }}
      config_template: ${{ steps.resolve.outputs.config_template }}
      target_service: ${{ steps.resolve.outputs.target_service }}
      secrets_provider: ${{ steps.resolve.outputs.secrets_provider }}
      doppler_project: ${{ steps.resolve.outputs.doppler_project }}
      doppler_config: ${{ steps.resolve.outputs.doppler_config }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}

    steps:
      - name: Log run context
        run: |
          echo "::notice::Resolve manifest ${{ needs.context.outputs.manifest_name }} env=${{ needs.context.outputs.target_environment }}"

      - name: Checkout platform repo
        uses: actions/checkout@v7

      - name: Resolve manifest
        id: resolve
        uses: ./.github/actions/resolve-manifest
        with:
          manifest_name: ${{ needs.context.outputs.manifest_name }}
          target_environment: ${{ needs.context.outputs.target_environment }}

      - name: Require Firebase
        env:
          PLATFORM: ${{ steps.resolve.outputs.platform }}
        run: |
          if [[ "$PLATFORM" != "firebase" ]]; then
            echo "::error::Frontend manifest platform '$PLATFORM' is not firebase"
            exit 1
          fi

  resolve_ref:
    name: Resolve git ref
    needs: [context, manifest]
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}

    steps:
      - name: Log run context
        run: |
          echo "::notice::Resolve git ref tag=${{ needs.context.outputs.tag_name }} branch=${{ needs.manifest.outputs.source_ref }} repo=${{ needs.manifest.outputs.repository }}"

      - name: Checkout platform repo
        uses: actions/checkout@v7

      - name: Resolve ref
        id: resolve
        uses: ./.github/actions/resolve-git-ref
        with:
          tag_name: ${{ needs.context.outputs.tag_name }}
          target_branch: ${{ needs.manifest.outputs.source_ref }}
          repository: ${{ needs.manifest.outputs.repository }}
          github_token: ${{ secrets.PAT }}

  resolve_env:
    name: Resolve GitHub Environment
    needs: context
    runs-on: ubuntu-latest
    outputs:
      gh_env: ${{ steps.resolve.outputs.gh_env }}

    steps:
      - name: Log run context
        run: |
          echo "::notice::Resolve GitHub Environment target=${{ needs.context.outputs.target_environment }}"

      - name: Checkout platform repo
        uses: actions/checkout@v7

      - name: Resolve environment
        id: resolve
        uses: ./.github/actions/resolve-deployment-environment
        with:
          trigger_type: ${{ github.event_name }}
          target_environment: ${{ needs.context.outputs.target_environment }}
          workflow_type: deploy

  deploy:
    name: Deploy Firebase
    needs: [manifest, resolve_ref, resolve_env, context]
    uses: ./.github/workflows/reusable-deploy-firebase-node.yml
    with:
      app_name: ${{ needs.manifest.outputs.app_name }}
      repository: ${{ needs.manifest.outputs.repository }}
      build_root: ${{ needs.manifest.outputs.build_root }}
      app_root: ${{ needs.manifest.outputs.app_root }}
      node_version: ${{ needs.manifest.outputs.node_version }}
      install_command: ${{ needs.manifest.outputs.install_command }}
      build_command: ${{ needs.manifest.outputs.build_command }}
      output_path: ${{ needs.manifest.outputs.output_path }}
      config_template: ${{ needs.manifest.outputs.config_template }}
      secrets_provider: ${{ needs.manifest.outputs.secrets_provider }}
      doppler_project: ${{ needs.manifest.outputs.doppler_project }}
      doppler_config: ${{ needs.manifest.outputs.doppler_config }}
      firebase_site: ${{ needs.manifest.outputs.target_service }}
      ref: ${{ needs.resolve_ref.outputs.ref }}
      use_gh_env: true
      gh_env: ${{ needs.resolve_env.outputs.gh_env }}
      target_environment: ${{ needs.context.outputs.target_environment }}
    secrets: inherit
