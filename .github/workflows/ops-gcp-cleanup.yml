name: Ops — GCP Scheduled Cleanup

# Scheduled GCP resource cleanup.
# Runs Mon/Wed/Fri at 17:00 UTC and can be triggered manually.
# Matrix strategy: stage and prod run in parallel (fail-fast: false).
# Binds to each matrix environment ('stage' / 'prod') to pick up GCP_SA_KEY and GCP_PROJECT_ID.
#
# What it cleans:
#   1. Old GAE versions      — keeps latest N (default: 2 serving versions)
#   2. Stale GCS bucket files — files older than N days in staging buckets
#   3. Untagged Artifact Registry images

on:
  schedule:
    - cron: '0 17 * * 1,3,5'

  workflow_dispatch:
    inputs:
      environments:
        description: 'Which environments to clean'
        required: true
        type: choice
        options:
          - both
          - stage
          - prod
        default: both
      keep_versions:
        description: 'GAE versions to keep per service'
        required: false
        type: number
        default: 2
      stale_days:
        description: 'Delete GCS files older than N days'
        required: false
        type: number
        default: 3
      dry_run:
        description: 'Dry run — report but do not delete'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build target environment matrix from inputs
  # ──────────────────────────────────────────────────────────────────────────
  setup:
    name: Build environment matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      keep_versions: ${{ steps.build.outputs.keep_versions }}
      stale_days: ${{ steps.build.outputs.stale_days }}
      dry_run: ${{ steps.build.outputs.dry_run }}

    steps:
      - name: Build matrix
        id: build
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENVS: ${{ github.event_name == 'workflow_dispatch' && inputs.environments || 'both' }}
          INPUT_KEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_versions || '2' }}
          INPUT_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.stale_days || '3' }}
          INPUT_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          case "$INPUT_ENVS" in
            stage) MATRIX='{"environment":["stage"]}' ;;
            prod)  MATRIX='{"environment":["prod"]}' ;;
            *)     MATRIX='{"environment":["stage","prod"]}' ;;
          esac

          echo "matrix=$MATRIX"            >> "$GITHUB_OUTPUT"
          echo "keep_versions=$INPUT_KEEP" >> "$GITHUB_OUTPUT"
          echo "stale_days=$INPUT_DAYS"    >> "$GITHUB_OUTPUT"
          echo "dry_run=$INPUT_DRY"        >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # Cleanup per environment
  # ──────────────────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup — ${{ matrix.environment }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Prune old GAE versions
        id: gae_cleanup
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          KEEP_VERSIONS: ${{ needs.setup.outputs.keep_versions }}
          DRY_RUN: ${{ needs.setup.outputs.dry_run }}
          TARGET_ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail

          echo "## GAE Version Cleanup ($TARGET_ENV)" >> cleanup-summary.md

          # List all services
          SERVICES=$(gcloud app services list \
            --project="$GCP_PROJECT_ID" \
            --format='value(id)' 2>/dev/null || echo "")

          if [[ -z "$SERVICES" ]]; then
            echo "_No App Engine services found._" >> cleanup-summary.md
            exit 0
          fi

          TOTAL_DELETED=0

          while IFS= read -r SERVICE; do
            [[ -z "$SERVICE" ]] && continue

            # Get versions sorted by creation time (newest first)
            VERSIONS=$(gcloud app versions list \
              --service="$SERVICE" \
              --project="$GCP_PROJECT_ID" \
              --format='value(id,TRAFFIC_SPLIT,SERVING_STATUS)' \
              --sort-by='~creationTime' 2>/dev/null || echo "")

            # Keep first N serving versions, collect rest for deletion
            SERVING_COUNT=0
            TO_DELETE=()

            while IFS=$'\t' read -r VID SPLIT STATUS; do
              [[ -z "$VID" ]] && continue
              if [[ "$STATUS" == "SERVING" || ( "$SERVING_COUNT" -lt "$KEEP_VERSIONS" ) ]]; then
                (( SERVING_COUNT++ ))
              else
                TO_DELETE+=("$VID")
              fi
            done <<< "$VERSIONS"

            if [[ ${#TO_DELETE[@]} -eq 0 ]]; then
              echo "| $SERVICE | No versions to prune (${SERVING_COUNT} active) |" >> cleanup-summary.md
              continue
            fi

            DELETE_LIST=$(printf '%s\n' "${TO_DELETE[@]}" | tr '\n' ' ')
            echo "| $SERVICE | Pruning ${#TO_DELETE[@]} version(s): $DELETE_LIST |" >> cleanup-summary.md

            if [[ "$DRY_RUN" == "false" ]]; then
              gcloud app versions delete "${TO_DELETE[@]}" \
                --service="$SERVICE" \
                --project="$GCP_PROJECT_ID" \
                --quiet || echo "::warning::Some versions could not be deleted in $SERVICE"
              TOTAL_DELETED=$(( TOTAL_DELETED + ${#TO_DELETE[@]} ))
            fi
          done <<< "$SERVICES"

          echo "gae_deleted=$TOTAL_DELETED" >> "$GITHUB_OUTPUT"

      - name: Clean stale GCS staging files
        id: gcs_cleanup
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STALE_DAYS: ${{ needs.setup.outputs.stale_days }}
          DRY_RUN: ${{ needs.setup.outputs.dry_run }}
        run: |
          set -euo pipefail

          echo "" >> cleanup-summary.md
          echo "## GCS Staging Cleanup" >> cleanup-summary.md

          STAGING_BUCKET="staging.${GCP_PROJECT_ID}.appspot.com"
          CUTOFF_DATE=$(date -u -d "${STALE_DAYS} days ago" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null \
            || date -u -v-${STALE_DAYS}d '+%Y-%m-%dT%H:%M:%SZ')

          STALE_FILES=$(gsutil ls -l "gs://${STAGING_BUCKET}/**" 2>/dev/null \
            | awk -v cutoff="$CUTOFF_DATE" 'NF==3 && $2 < cutoff {print $3}' \
            || echo "")

          COUNT=$(echo "$STALE_FILES" | grep -c . || echo 0)
          echo "| Staging bucket | ${STAGING_BUCKET} | Files older than ${STALE_DAYS}d: ${COUNT} |" >> cleanup-summary.md

          if [[ -n "$STALE_FILES" && "$DRY_RUN" == "false" ]]; then
            echo "$STALE_FILES" | while read f; do
              [[ -n "$f" ]] && gsutil rm "$f" 2>/dev/null || true
            done
          fi

          echo "gcs_deleted=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Clean untagged Artifact Registry images
        id: ar_cleanup
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DRY_RUN: ${{ needs.setup.outputs.dry_run }}
        run: |
          set -euo pipefail

          echo "" >> cleanup-summary.md
          echo "## Artifact Registry Cleanup" >> cleanup-summary.md

          # List all AR repositories in the project
          REPOS=$(gcloud artifacts repositories list \
            --project="$GCP_PROJECT_ID" \
            --format='value(name)' 2>/dev/null || echo "")

          if [[ -z "$REPOS" ]]; then
            echo "_No Artifact Registry repositories found._" >> cleanup-summary.md
            echo "ar_deleted=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AR_DELETED=0
          while IFS= read -r REPO; do
            [[ -z "$REPO" ]] && continue
            REPO_PATH=$(echo "$REPO" | sed 's|.*/repositories/||')

            UNTAGGED=$(gcloud artifacts docker images list "$REPO" \
              --project="$GCP_PROJECT_ID" \
              --filter="tags=''" \
              --format='value(IMAGE)' 2>/dev/null || echo "")

            COUNT=$(echo "$UNTAGGED" | grep -c . || echo 0)
            echo "| $REPO_PATH | Untagged images: $COUNT |" >> cleanup-summary.md

            if [[ -n "$UNTAGGED" && "$DRY_RUN" == "false" ]]; then
              echo "$UNTAGGED" | while read img; do
                [[ -n "$img" ]] && gcloud artifacts docker images delete "$img" \
                  --project="$GCP_PROJECT_ID" \
                  --delete-tags \
                  --quiet 2>/dev/null || true
              done
              AR_DELETED=$(( AR_DELETED + COUNT ))
            fi
          done <<< "$REPOS"

          echo "ar_deleted=$AR_DELETED" >> "$GITHUB_OUTPUT"

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cleanup-report-${{ matrix.environment }}-${{ github.run_id }}
          path: cleanup-summary.md
          retention-days: 7

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## GCP Cleanup — \`${{ matrix.environment }}\`"
            echo ""
            echo "| Resource | Deleted |"
            echo "|----------|---------|"
            echo "| GAE versions | ${{ steps.gae_cleanup.outputs.gae_deleted || 0 }} |"
            echo "| GCS files | ${{ steps.gcs_cleanup.outputs.gcs_deleted || 0 }} |"
            echo "| AR images | ${{ steps.ar_cleanup.outputs.ar_deleted || 0 }} |"
            echo ""
            if [[ "${{ needs.setup.outputs.dry_run }}" == "true" ]]; then
              echo "> ⚠️ **DRY RUN** — no resources were actually deleted."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
