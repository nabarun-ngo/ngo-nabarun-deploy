name: Ops — GCP Scheduled Cleanup

# Scheduled GCP resource cleanup.
# Runs Mon/Wed/Fri at 17:00 UTC and can be triggered manually.
# Matrix strategy: stage and prod run in parallel (fail-fast: false).
# Binds to each matrix environment ('stage' / 'prod') to pick up GCP_SA_KEY and GCP_PROJECT_ID.
#
# What it cleans:
#   1. Old GAE versions      — keeps latest N (default: 2 serving versions)
#   2. Stale GCS bucket files — files older than N days in staging buckets
#   3. Untagged Artifact Registry images

on:
  schedule:
    - cron: '0 17 * * 1,3,5'

  workflow_dispatch:
    inputs:
      environments:
        description: 'Which environments to clean'
        required: true
        type: choice
        options:
          - both
          - stage
          - prod
        default: both
      keep_versions:
        description: 'GAE versions to keep per service'
        required: false
        type: number
        default: 2
      stale_days:
        description: 'Delete GCS files older than N days'
        required: false
        type: number
        default: 3
      dry_run:
        description: 'Dry run — report but do not delete'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Build target environment matrix from inputs
  # ──────────────────────────────────────────────────────────────────────────
  setup:
    name: Build environment matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      keep_versions: ${{ steps.build.outputs.keep_versions }}
      stale_days: ${{ steps.build.outputs.stale_days }}
      dry_run: ${{ steps.build.outputs.dry_run }}

    steps:
      - name: Log run context
        run: |
          echo "::notice::GCP cleanup matrix event=${GITHUB_EVENT_NAME} envs=${{ github.event_name == 'workflow_dispatch' && inputs.environments || 'both' }}"

      - name: Build matrix
        id: build
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENVS: ${{ github.event_name == 'workflow_dispatch' && inputs.environments || 'both' }}
          INPUT_KEEP: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_versions || '2' }}
          INPUT_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.stale_days || '3' }}
          INPUT_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          case "$INPUT_ENVS" in
            stage) MATRIX='{"environment":["stage"]}' ;;
            prod)  MATRIX='{"environment":["prod"]}' ;;
            *)     MATRIX='{"environment":["stage","prod"]}' ;;
          esac

          {
            echo "matrix=$MATRIX"
            echo "keep_versions=$INPUT_KEEP"
            echo "stale_days=$INPUT_DAYS"
            echo "dry_run=$INPUT_DRY"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Cleanup matrix=$MATRIX keep=$INPUT_KEEP stale_days=$INPUT_DAYS dry_run=$INPUT_DRY"
          echo "### Cleanup matrix" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$MATRIX\` keep=$INPUT_KEEP days=$INPUT_DAYS dry_run=$INPUT_DRY" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # Cleanup per environment
  # ──────────────────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup — ${{ matrix.environment }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Log run context
        run: |
          echo "::notice::GCP cleanup ${{ matrix.environment }} keep=${{ needs.setup.outputs.keep_versions }} dry_run=${{ needs.setup.outputs.dry_run }}"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Prune old GAE versions
        id: gae_cleanup
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          KEEP_VERSIONS: ${{ needs.setup.outputs.keep_versions }}
          DRY_RUN: ${{ needs.setup.outputs.dry_run }}
          TARGET_ENV: ${{ matrix.environment }}
        run: bash scripts/gcp-cleanup-gae.sh

      - name: Clean stale GCS staging files
        id: gcs_cleanup
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          STALE_DAYS: ${{ needs.setup.outputs.stale_days }}
          DRY_RUN: ${{ needs.setup.outputs.dry_run }}
        run: bash scripts/gcp-cleanup-gcs.sh

      - name: Clean untagged Artifact Registry images
        id: ar_cleanup
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DRY_RUN: ${{ needs.setup.outputs.dry_run }}
        run: bash scripts/gcp-cleanup-registry.sh

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cleanup-report-${{ matrix.environment }}-${{ github.run_id }}
          path: cleanup-summary.md
          retention-days: 7

      - name: Write step summary
        if: always()
        env:
          TARGET_ENV: ${{ matrix.environment }}
          DRY_RUN: ${{ needs.setup.outputs.dry_run }}
          GAE_DELETED: ${{ steps.gae_cleanup.outputs.gae_deleted }}
          GCS_DELETED: ${{ steps.gcs_cleanup.outputs.gcs_deleted }}
          AR_DELETED: ${{ steps.ar_cleanup.outputs.ar_deleted }}
        run: bash scripts/gcp-cleanup-summary.sh
