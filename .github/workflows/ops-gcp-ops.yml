name: Ops — GCP Operations Hub

# Interactive GCP operations hub — enhanced over the original GCP-Logs.yml.
# All operations run via workflow_dispatch only.
# Secrets are scoped to the selected environment (stage/prod).
# Destructive operations require confirm: "yes" to prevent accidental triggers.
#
# Operations:
#   download-logs      — fetch Cloud Logging entries → artifact
#   restart-service    — stop all running instances for cold restart
#   view-versions      — list deployed GAE versions with traffic split
#   cleanup-versions   — delete old non-serving GAE versions (interactive)
#   cleanup-gcs        — delete stale GCS staging files
#   cleanup-registry   — prune untagged Artifact Registry images (on-demand)
#
# Operation bodies live in scripts/gcp-ops.sh and scripts/gcp-ops-summary.sh.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - download-logs
          - restart-service
          - view-versions
          - cleanup-versions
          - cleanup-gcs
          - cleanup-registry
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - stage
          - prod
      service_name:
        description: 'GAE service name (default: default)'
        required: false
        default: 'default'
      log_filter:
        description: 'Cloud Logging filter (for download-logs)'
        required: false
        default: 'resource.type="gae_app"'
      log_severity:
        description: 'Minimum log severity (for download-logs)'
        required: false
        type: choice
        options:
          - DEFAULT
          - INFO
          - WARNING
          - ERROR
          - CRITICAL
        default: 'DEFAULT'
      last_hours:
        description: 'Log time window in hours (for download-logs, default: 24)'
        required: false
        default: '24'
      log_format:
        description: 'Log output format'
        required: false
        type: choice
        options:
          - txt
          - json
          - csv
        default: 'txt'
      keep_versions:
        description: 'GAE versions to keep (for cleanup-versions, default: 2)'
        required: false
        default: '2'
      dry_run:
        description: 'Dry run mode for cleanup operations'
        required: false
        type: boolean
        default: true
      confirm:
        description: 'Type "yes" to confirm destructive operations (restart, cleanup-*)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Validate inputs before consuming secrets
  # ──────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    outputs:
      is_destructive: ${{ steps.check.outputs.is_destructive }}

    steps:
      - name: Log run context
        env:
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          echo "::notice::GCP ops validate operation=${{ inputs.operation }} env=${{ inputs.environment }}"
          echo "::group::Dispatch inputs"
          echo "${LOG_INPUTS}"
          echo "::endgroup::"

      - name: Check destructive operation confirmation
        id: check
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          DESTRUCTIVE_OPS="restart-service cleanup-versions cleanup-gcs cleanup-registry"

          IS_DESTRUCTIVE="false"
          if echo "$DESTRUCTIVE_OPS" | grep -qw "$OPERATION"; then
            IS_DESTRUCTIVE="true"
            if [[ "$CONFIRM" != "yes" ]]; then
              echo "::error::Operation '$OPERATION' is destructive. Set confirm to 'yes' to proceed."
              exit 1
            fi
          fi

          echo "is_destructive=$IS_DESTRUCTIVE" >> "$GITHUB_OUTPUT"
          echo "::notice::Operation: $OPERATION | Destructive: $IS_DESTRUCTIVE"

  # ──────────────────────────────────────────────────────────────────────────
  # Execute selected operation
  # ──────────────────────────────────────────────────────────────────────────
  execute:
    name: Execute — ${{ inputs.operation }} (${{ inputs.environment }})
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    outputs:
      result_summary: ${{ steps.op.outputs.result_summary }}
      artifact_name: ${{ steps.op.outputs.artifact_name }}

    steps:
      - name: Log run context
        env:
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          echo "::notice::GCP ops execute ${{ inputs.operation }} env=${{ inputs.environment }} dry_run=${{ inputs.dry_run }}"
          echo "::group::Execute inputs"
          echo "${LOG_INPUTS}"
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Execute operation
        id: op
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          OPERATION: ${{ inputs.operation }}
          SERVICE_NAME: ${{ inputs.service_name }}
          LOG_FILTER: ${{ inputs.log_filter }}
          LOG_SEVERITY: ${{ inputs.log_severity }}
          LAST_HOURS: ${{ inputs.last_hours }}
          LOG_FORMAT: ${{ inputs.log_format }}
          KEEP_VERSIONS: ${{ inputs.keep_versions }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_ENV: ${{ inputs.environment }}
        run: bash scripts/gcp-ops.sh

      - name: Upload operation artifact
        if: ${{ steps.op.outputs.artifact_name != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.op.outputs.artifact_name }}
          path: |
            cloud-logs.*
            versions-report.txt
            versions-cleanup.txt
            gcs-cleanup.txt
            ar-cleanup.txt
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────────
  # Rich summary (always runs)
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    name: Operation summary
    needs: [validate, execute]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write step summary
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_ENV: ${{ inputs.environment }}
          SERVICE_NAME: ${{ inputs.service_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESULT_SUMMARY: ${{ needs.execute.outputs.result_summary }}
          ARTIFACT_NAME: ${{ needs.execute.outputs.artifact_name }}
          EXECUTE_RESULT: ${{ needs.execute.result }}
        run: bash scripts/gcp-ops-summary.sh
