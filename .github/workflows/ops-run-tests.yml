name: Ops — Run Tests

# Thin caller for executing Cucumber tests with Allure reporting.
# Manual dispatch and scheduled cron profiles. Manual prod binds to GitHub
# Environment 'prod' (reviewers). Scheduled runs bind to 'tests-scheduled'.

on:
  workflow_dispatch:
    inputs:
      test_tags:
        description: 'Cucumber tag expression (e.g. @smoke, @regression)'
        required: true
        type: string
        default: '@smoke'
      target_environment:
        description: 'Environment under test'
        required: true
        type: choice
        options:
          - stage
          - prod
      parallelism:
        description: 'Parallel shards (forced to 1 when target is prod)'
        required: false
        type: number
        default: 3

  schedule:
    # Nightly smoke tests against stage at 03:00 UTC
    - cron: '0 3 * * *'
    # Weekly full regression every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  profile:
    name: Resolve test profile
    runs-on: ubuntu-latest
    outputs:
      test_tags: ${{ steps.finalize.outputs.test_tags }}
      target_environment: ${{ steps.finalize.outputs.target_environment }}
      parallelism: ${{ steps.finalize.outputs.parallelism }}
      timeout_minutes: ${{ steps.finalize.outputs.timeout_minutes }}
      gh_env: ${{ steps.route.outputs.gh_env }}
      doppler_config: ${{ steps.finalize.outputs.doppler_config }}
      report_title: ${{ steps.finalize.outputs.report_title }}

    steps:
      - name: Log run context
        run: |
          echo "::notice::Resolve test profile event=${GITHUB_EVENT_NAME} schedule=${{ github.event.schedule }}"

      - name: Checkout platform repo
        uses: actions/checkout@v7

      - name: Resolve profile
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          INPUT_TAGS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_tags || '' }}
          INPUT_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || '' }}
          INPUT_PARALLELISM: ${{ github.event_name == 'workflow_dispatch' && inputs.parallelism || '3' }}
        run: |
          set -euo pipefail

          TEST_TAGS="@smoke"
          TARGET_ENV="stage"
          PARALLELISM=3
          TIMEOUT=60
          REPORT_TITLE="Smoke Tests"

          case "$EVENT_NAME" in
            schedule)
              if [[ "$CRON_SCHEDULE" == "0 3 * * *" ]]; then
                PROFILE=$(jq -c '.schedules[] | select(.id == "nightly-smoke")' config/schedules/tests.json)
                TEST_TAGS=$(echo "$PROFILE" | jq -r '.profile.tags')
                TARGET_ENV=$(echo "$PROFILE" | jq -r '.profile.environment')
                PARALLELISM=$(echo "$PROFILE" | jq -r '.profile.parallelism')
                TIMEOUT=$(echo "$PROFILE" | jq -r '.profile.timeoutMinutes')
                REPORT_TITLE="Nightly Smoke — $(date -u +%Y-%m-%d)"
              elif [[ "$CRON_SCHEDULE" == "0 2 * * 1" ]]; then
                PROFILE=$(jq -c '.schedules[] | select(.id == "weekly-regression")' config/schedules/tests.json)
                TEST_TAGS=$(echo "$PROFILE" | jq -r '.profile.tags')
                TARGET_ENV=$(echo "$PROFILE" | jq -r '.profile.environment')
                PARALLELISM=$(echo "$PROFILE" | jq -r '.profile.parallelism')
                TIMEOUT=$(echo "$PROFILE" | jq -r '.profile.timeoutMinutes')
                REPORT_TITLE="Weekly Regression — $(date -u +%Y-%m-%d)"
              fi
              ;;
            workflow_dispatch)
              TEST_TAGS="$INPUT_TAGS"
              TARGET_ENV="$INPUT_ENV"
              PARALLELISM="$INPUT_PARALLELISM"
              REPORT_TITLE="Manual — ${TEST_TAGS} (${TARGET_ENV})"
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          case "$TARGET_ENV" in
            stage) DOPPLER_CONFIG="stg" ;;
            prod) DOPPLER_CONFIG="prd" ;;
            *)
              echo "::error::Unknown target_environment: $TARGET_ENV"
              exit 1
              ;;
          esac

          {
            echo "test_tags=$TEST_TAGS"
            echo "target_environment=$TARGET_ENV"
            echo "parallelism=$PARALLELISM"
            echo "timeout_minutes=$TIMEOUT"
            echo "doppler_config=$DOPPLER_CONFIG"
            echo "report_title<<EOF"
            echo "$REPORT_TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve GitHub Environment
        id: route
        uses: ./.github/actions/resolve-deployment-environment
        with:
          trigger_type: ${{ github.event_name }}
          target_environment: ${{ steps.resolve.outputs.target_environment }}
          workflow_type: tests

      - name: Finalize profile
        id: finalize
        env:
          TEST_TAGS: ${{ steps.resolve.outputs.test_tags }}
          TARGET_ENV: ${{ steps.resolve.outputs.target_environment }}
          PARALLELISM: ${{ steps.resolve.outputs.parallelism }}
          TIMEOUT: ${{ steps.resolve.outputs.timeout_minutes }}
          DOPPLER_CONFIG: ${{ steps.resolve.outputs.doppler_config }}
          REPORT_TITLE: ${{ steps.resolve.outputs.report_title }}
          GH_ENV: ${{ steps.route.outputs.gh_env }}
        run: |
          set -euo pipefail
          if [[ "$GH_ENV" == "prod" ]]; then
            PARALLELISM=1
            echo "::notice::Pinning parallelism to 1 for prod (one approval per run)"
          fi
          {
            echo "test_tags=$TEST_TAGS"
            echo "target_environment=$TARGET_ENV"
            echo "parallelism=$PARALLELISM"
            echo "timeout_minutes=$TIMEOUT"
            echo "doppler_config=$DOPPLER_CONFIG"
            echo "report_title<<EOF"
            echo "$REPORT_TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "::group::Resolved test profile"
          echo "test_tags=$TEST_TAGS"
          echo "target_environment=$TARGET_ENV"
          echo "parallelism=$PARALLELISM"
          echo "timeout_minutes=$TIMEOUT"
          echo "gh_env=$GH_ENV"
          echo "doppler_config=$DOPPLER_CONFIG"
          echo "report_title=$REPORT_TITLE"
          echo "::endgroup::"
          echo "::notice::Test profile — tags=$TEST_TAGS env=$TARGET_ENV gh_env=$GH_ENV shards=$PARALLELISM doppler=$DOPPLER_CONFIG"

  tests:
    name: Run tests
    needs: profile
    uses: ./.github/workflows/reusable-run-tests-allure.yml
    with:
      test_repository: ${{ vars.TEST_REPOSITORY }}
      test_branch: main
      test_tags: ${{ needs.profile.outputs.test_tags }}
      target_environment: ${{ needs.profile.outputs.target_environment }}
      use_gh_env: true
      gh_env: ${{ needs.profile.outputs.gh_env }}
      doppler_project: ${{ vars.DOPPLER_PROJECT_TEST }}
      doppler_config: ${{ needs.profile.outputs.doppler_config }}
      parallelism: ${{ fromJson(needs.profile.outputs.parallelism) }}
      timeout_minutes: ${{ fromJson(needs.profile.outputs.timeout_minutes) }}
      report_title: ${{ needs.profile.outputs.report_title }}
    secrets:
      PAT: ${{ secrets.PAT }}

  summary:
    name: Test run summary
    needs: [profile, tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Write run summary
        env:
          TEST_TAGS: ${{ needs.profile.outputs.test_tags }}
          TARGET_ENV: ${{ needs.profile.outputs.target_environment }}
          GH_ENV: ${{ needs.profile.outputs.gh_env }}
          SHARDS: ${{ needs.profile.outputs.parallelism }}
          TOTAL: ${{ needs.tests.outputs.total_tests }}
          PASSED: ${{ needs.tests.outputs.passed_tests }}
          FAILED: ${{ needs.tests.outputs.failed_tests }}
          BROKEN: ${{ needs.tests.outputs.broken_tests }}
          REPORT_URL: ${{ needs.tests.outputs.report_url }}
          TESTS_PASSED: ${{ needs.tests.outputs.tests_passed }}
        run: |
          {
            echo "## Test Run Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Tags | \`${TEST_TAGS}\` |"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| GitHub Environment | \`${GH_ENV}\` |"
            echo "| Shards | ${SHARDS} |"
            echo "| Total tests | ${TOTAL} |"
            echo "| Passed | ${PASSED} |"
            echo "| Failed | ${FAILED} |"
            echo "| Broken | ${BROKEN} |"
            echo "| Gate | ${TESTS_PASSED} |"
            echo "| Report | [${REPORT_URL}](${REPORT_URL}) |"
          } >> "$GITHUB_STEP_SUMMARY"
