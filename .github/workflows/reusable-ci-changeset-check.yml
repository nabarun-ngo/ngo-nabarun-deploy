name: Reusable — CI Changeset check

# Called by library repos on pull_request.
# Validates conventional commit titles. If paths under packages_filter changed,
# the Changeset bump must match the commit and `changeset status` must pass.
# A same-repo pull request from changeset-release/<base> skips the Changeset
# requirement, not the title check. That branch is the Version Packages pull request.

on:
  workflow_call:
    inputs:
      templates_repository:
        description: >
          Templates repository that contains scripts/release_model.py, as owner/name.
          Required. A called workflow runs in the consumer repository, so the consumer passes this.
        type: string
        required: true
      node_version:
        description: Node.js version.
        type: string
        required: false
        default: '22'
      working_directory:
        description: Directory with package-lock.json and .changeset (repo-relative).
        type: string
        required: false
        default: '.'
      packages_filter:
        description: Glob that counts as a package change (dorny/paths-filter).
        type: string
        required: false
        default: 'packages/**'
      install_command:
        description: Install command when package files changed.
        type: string
        required: false
        default: 'npm ci'
      use_gh_env:
        description: Bind the job to a GitHub Environment (reviewers / env secrets).
        type: boolean
        required: false
        default: false
      gh_env:
        description: GitHub Environment name when use_gh_env is true (e.g. stage, prod).
        type: string
        required: false
        default: ''

    secrets:
      TEMPLATES_TOKEN:
        description: Token with read access to templates_repository.
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changeset-check:
    name: Require changeset for package changes
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_gh_env && inputs.gh_env || '' }}

    steps:
      - name: Log run context
        env:
          LOG_TITLE: Changeset check
          LOG_INPUTS: ${{ toJSON(inputs) }}
          LOG_EXTRA: |
            base_ref=${{ github.base_ref }}
            head_ref=${{ github.head_ref }}
            pr=${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "::notice::${LOG_TITLE} — PR #${{ github.event.pull_request.number }} base=${GITHUB_BASE_REF} sha=${GITHUB_SHA:0:7}"
          echo "::group::${LOG_TITLE} context"
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA}"
          echo "job=${GITHUB_JOB} actor=${GITHUB_ACTOR} run=${GITHUB_RUN_ID}"
          echo "${LOG_INPUTS}"
          echo "${LOG_EXTRA}"
          echo "::endgroup::"

      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout templates repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.templates_repository }}
          path: ext_repo
          token: ${{ secrets.TEMPLATES_TOKEN }}

      - name: Stage release model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-model"
          cp ext_repo/scripts/release_model.py "$RUNNER_TEMP/release-model/release_model.py"
          rm -rf ext_repo


      - name: Detect package changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            packages:
              - ${{ inputs.packages_filter }}

      - name: Log package-change result
        env:
          PACKAGES_CHANGED: ${{ steps.changes.outputs.packages }}
        run: |
          echo "::notice::packages_filter=${{ inputs.packages_filter }} changed=${PACKAGES_CHANGED}"
          {
            echo "### Changeset check"
            echo ""
            echo "packages changed: \`${PACKAGES_CHANGED}\` (filter \`${{ inputs.packages_filter }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGES_CHANGED" != "true" ]]; then
            echo "::notice::No package path changes; changeset status skipped."
          fi

      - name: Detect Version Packages pull request
        id: version_pr
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REPO" == "$BASE_REPO" && "$HEAD_REF" == "changeset-release/${BASE_REF}" ]]; then
            echo "generated=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version Packages pull request from ${HEAD_REF}"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release commits and changeset bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          SKIP_CHANGESET: ${{ steps.version_pr.outputs.generated }}
          PACKAGES_CHANGED: ${{ steps.changes.outputs.packages }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          PYTHONPATH: ${{ runner.temp }}/release-model
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          python3 - << 'PY'
          import os, subprocess, sys
          from pathlib import Path
          import release_model
          base = os.environ["BASE_REF"]
          log = subprocess.check_output(["git", "log", "--format=%B%x1f", f"origin/{base}..HEAD"], text=True)
          commits = [item.strip("\n") for item in log.split("\x1f") if item.strip()]
          changesets = []
          root = Path(os.environ.get("WORKING_DIRECTORY") or ".")
          changeset_dir = root / ".changeset"
          if changeset_dir.is_dir():
              for path in changeset_dir.glob("*.md"):
                  if path.name != "README.md":
                      changesets.append(path.read_text(encoding="utf-8"))
          payload = {
              "title": os.environ["PR_TITLE"],
              "commits": commits,
              "changesets": changesets,
              "packages_changed": os.environ.get("PACKAGES_CHANGED") == "true",
              "skip_changeset": os.environ["SKIP_CHANGESET"] == "true",
          }
          errors = release_model.validate_pull_request(payload)
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print("Release commit policy passed")
          PY

      - name: Setup Node.js
        if: steps.changes.outputs.packages == 'true' && steps.version_pr.outputs.generated != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory == '.' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working_directory) }}

      - name: Install dependencies
        if: steps.changes.outputs.packages == 'true' && steps.version_pr.outputs.generated != 'true'
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.install_command }}

      - name: Verify changesets
        if: steps.changes.outputs.packages == 'true' && steps.version_pr.outputs.generated != 'true'
        working-directory: ${{ inputs.working_directory }}
        run: |
          echo "::notice::npx changeset status --since=origin/${{ github.base_ref }}"
          npx changeset status --since=origin/${{ github.base_ref }}
