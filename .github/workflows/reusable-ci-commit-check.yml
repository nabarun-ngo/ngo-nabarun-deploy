name: Reusable — CI commit check

# Called by application and library repos on pull_request.
# Rejects titles that are not fix, feat, feat!, docs, chore, or ci.
# Does not version, tag, or publish.

on:
  workflow_call:
    inputs:
      templates_repository:
        description: >
          Templates repository that contains scripts/release_model.py, as owner/name.
          Required. A called workflow runs in the consumer repository, so the consumer passes this.
        type: string
        required: true
      use_gh_env:
        description: Bind the job to a GitHub Environment.
        type: boolean
        required: false
        default: false
      gh_env:
        description: GitHub Environment name when use_gh_env is true.
        type: string
        required: false
        default: ''

    secrets:
      TEMPLATES_TOKEN:
        description: Token with read access to templates_repository.
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: Validate conventional commits
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_gh_env && inputs.gh_env || '' }}

    steps:
      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout templates repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.templates_repository }}
          path: ext_repo
          token: ${{ secrets.TEMPLATES_TOKEN }}

      - name: Stage release model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-model"
          cp ext_repo/scripts/release_model.py "$RUNNER_TEMP/release-model/release_model.py"
          rm -rf ext_repo


      - name: Validate commit titles
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
          PYTHONPATH: ${{ runner.temp }}/release-model
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          python3 - << 'PY'
          import os, subprocess, sys
          import release_model
          base = os.environ["BASE_REF"]
          log = subprocess.check_output(["git", "log", "--format=%B%x1f", f"origin/{base}..HEAD"], text=True)
          commits = [item.strip("\n") for item in log.split("\x1f") if item.strip()]
          errors = release_model.validate_pull_request({
              "title": os.environ.get("PR_TITLE", ""),
              "commits": commits,
              "changesets": [],
              "packages_changed": False,
              "skip_changeset": True,
          })
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print("Conventional commit policy passed")
          PY
