name: Reusable — CI commit check

# Called by application and library repos on pull_request.
# Rejects titles that are not fix, feat, feat!, docs, chore, or ci.
# Does not version, tag, or publish.

on:
  workflow_call:
    inputs:
      templates_repository:
        description: >
          Templates repository that contains scripts/release_model.py, as owner/name.
          Required. A called workflow runs in the consumer repository, so the consumer passes this.
        type: string
        required: true
      use_gh_env:
        description: Bind the job to a GitHub Environment.
        type: boolean
        required: false
        default: false
      gh_env:
        description: GitHub Environment name when use_gh_env is true.
        type: string
        required: false
        default: ''

    secrets:
      TEMPLATES_TOKEN:
        description: Token with read access to templates_repository.
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  commits:
    name: Validate conventional commits
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_gh_env && inputs.gh_env || '' }}

    steps:
      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout templates repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.templates_repository }}
          path: ext_repo
          token: ${{ secrets.TEMPLATES_TOKEN }}

      - name: Stage release model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-model"
          cp ext_repo/scripts/release_model.py "$RUNNER_TEMP/release-model/release_model.py"
          rm -rf ext_repo


      - name: Validate commit titles
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          python3 "$RUNNER_TEMP/release-model/release_model.py" check-pr
