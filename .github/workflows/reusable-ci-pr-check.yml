name: Reusable — CI PR Check

# Called by application repos on pull_request events.
# Runs semantic commit check → install → type-check → lint → build →
# (optional) unit tests.
# The 'ci/build' commit status posted here is the required status check
# that branch protection enforces before merging.
#
# The pull request title must be a Conventional Commit. That is a hard
# failure, because the title is editable in GitHub and can raise the release
# bump. Commit subjects on the branch are warnings only.
# Grammar matches scripts/release_model.py COMMIT_RE:
# fix|feat|docs|chore|ci, optional scope, optional !, then ": ".
#   fix:     patch
#   feat:    minor
#   feat!:   major (or a body line BREAKING CHANGE:)
#   docs:, chore:, ci:  no release

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version to use.
        type: string
        required: false
        default: '20'
      build_root:
        description: Working directory for all commands (relative to repo root).
        type: string
        required: false
        default: '.'
      install_command:
        description: Dependency install command.
        type: string
        required: false
        default: 'npm ci'
      build_command:
        description: Build command.
        type: string
        required: false
        default: 'npm run build'
      lint_command:
        description: Lint command. Skipped gracefully if the npm script is not defined.
        type: string
        required: false
        default: 'npm run lint'
      type_check_command:
        description: Type-check command. Skipped gracefully if the npm script is not defined.
        type: string
        required: false
        default: 'npm run type-check'
      enable_tests:
        description: Whether to run unit tests in this check.
        type: boolean
        required: false
        default: false
      test_command:
        description: Unit test command (used when enable_tests is true).
        type: string
        required: false
        default: 'npm test'
      upload_coverage:
        description: Upload coverage reports as an artifact.
        type: boolean
        required: false
        default: false
      coverage_path:
        description: Path to coverage output directory (relative to build_root).
        type: string
        required: false
        default: 'coverage'
      use_gh_env:
        description: Bind the job to a GitHub Environment (reviewers / env secrets).
        type: boolean
        required: false
        default: false
      gh_env:
        description: GitHub Environment name when use_gh_env is true (e.g. stage, prod).
        type: string
        required: false
        default: ''

    outputs:
      build_status:
        description: '"success" or "failure"'
        value: ${{ jobs.check.outputs.build_status }}

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  check:
    name: Build check
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_gh_env && inputs.gh_env || '' }}
    outputs:
      build_status: ${{ steps.result.outputs.build_status }}

    steps:
      - name: Log run context
        env:
          LOG_TITLE: PR Build check
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          echo "::notice::${LOG_TITLE} — ${GITHUB_EVENT_NAME} ${GITHUB_REF} sha=${GITHUB_SHA:0:7} run=${GITHUB_RUN_ID}"
          echo "::group::${LOG_TITLE} context"
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA}"
          echo "head_ref=${GITHUB_HEAD_REF} base_ref=${GITHUB_BASE_REF}"
          echo "job=${GITHUB_JOB} actor=${GITHUB_ACTOR} run=${GITHUB_RUN_ID}"
          echo "${LOG_INPUTS}"
          echo "::endgroup::"

      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate semantic commit messages
        id: commits
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Keep aligned with scripts/release_model.py COMMIT_RE.
          pattern='^(fix|feat|docs|chore|ci)(\([^)]+\))?(!)?: [^[:space:]].*$'
          failed=0

          is_ignored() {
            local subject="$1"
            [[ "$subject" == Merge\ * ]] && return 0
            [[ "$subject" == 'chore(release):'* ]] && return 0
            [[ "$subject" == *'[skip ci]'* ]] && return 0
            [[ "$subject" == *'[skip actions]'* ]] && return 0
            return 1
          }

          is_conventional() {
            local subject="$1"
            subject="${subject%%$'\n'*}"
            if is_ignored "$subject"; then
              echo "ignored: ${subject}"
              return 0
            fi
            if printf '%s\n' "$subject" | grep -Eq -- "$pattern"; then
              echo "ok: ${subject}"
              return 0
            fi
            return 1
          }

          if [[ -z "${BASE_REF}" ]]; then
            echo "::notice::No pull request base ref. Semantic commit check applies only to pull_request. Skipping."
            exit 0
          fi

          git fetch --no-tags origin "${BASE_REF}"
          if [[ -z "${PR_TITLE}" ]]; then
            echo "::error::Pull request title is empty. Use a Conventional Commit subject so the release version can be calculated."
            failed=1
          elif ! is_conventional "${PR_TITLE}"; then
            echo "::error::Pull request title is not a Conventional Commit, so no semantic version can be calculated: ${PR_TITLE}"
            failed=1
          fi

          git log --format='%s' "origin/${BASE_REF}..HEAD" > "${RUNNER_TEMP}/commit-subjects.txt"
          while IFS= read -r subject || [[ -n "${subject}" ]]; do
            [[ -z "${subject}" ]] && continue
            if ! is_conventional "${subject}"; then
              echo "::warning::Commit is not a Conventional Commit: ${subject}. This does not block the pull request. Only the pull request title must be a Conventional Commit."
            fi
          done < "${RUNNER_TEMP}/commit-subjects.txt"

          if [[ "${failed}" -ne 0 ]]; then
            {
              echo "### Semantic commit check failed"
              echo ""
              echo "The pull request title must be a Conventional Commit. Commit subjects on the branch are warnings and do not fail this check."
              echo ""
              echo "| Subject | Version |"
              echo "|---------|---------|"
              echo "| \`fix:\` | patch |"
              echo "| \`feat:\` | minor |"
              echo "| \`feat!:\` or a body line \`BREAKING CHANGE:\` | major |"
              echo "| \`docs:\`, \`chore:\`, \`ci:\` | no release |"
              echo ""
              echo "A scope is optional: \`feat(api): add filter\`."
              echo ""
              echo "#### How to recover"
              echo ""
              echo "Edit the pull request title in GitHub. That does not rewrite history."
              echo "If this pull request is already merged, do not rewrite \`main\` or \`develop\`. Open a follow-up pull request with a valid title."
            } | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo "Semantic commit check passed"

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.build_root == '.' && 'package-lock.json' || format('{0}/package-lock.json', inputs.build_root) }}

      - name: Install dependencies
        working-directory: ${{ inputs.build_root }}
        run: ${{ inputs.install_command }}

      - name: Type check
        id: type_check
        working-directory: ${{ inputs.build_root }}
        run: |
          # Extract script name from command (e.g. "npm run type-check" → "type-check")
          SCRIPT=$(echo "${{ inputs.type_check_command }}" | sed 's/npm run //')
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$SCRIPT'] ? 0 : 1)" 2>/dev/null; then
            ${{ inputs.type_check_command }}
          else
            echo "::notice::Type-check script '$SCRIPT' not found in package.json, skipping."
          fi

      - name: Lint
        id: lint
        working-directory: ${{ inputs.build_root }}
        run: |
          SCRIPT=$(echo "${{ inputs.lint_command }}" | sed 's/npm run //')
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['$SCRIPT'] ? 0 : 1)" 2>/dev/null; then
            ${{ inputs.lint_command }}
          else
            echo "::notice::Lint script '$SCRIPT' not found in package.json, skipping."
          fi

      - name: Build
        id: build
        working-directory: ${{ inputs.build_root }}
        run: ${{ inputs.build_command }}

      - name: Unit tests
        id: tests
        if: ${{ inputs.enable_tests == true }}
        working-directory: ${{ inputs.build_root }}
        run: ${{ inputs.test_command }}

      - name: Upload coverage artifact
        if: ${{ inputs.upload_coverage == true && inputs.enable_tests == true }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: ${{ inputs.build_root }}/${{ inputs.coverage_path }}
          retention-days: 7
          if-no-files-found: warn

      - name: Resolve build result
        id: result
        if: always()
        run: |
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "build_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "build_status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Write step summary
        if: always()
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          {
            echo "### CI Build Check"
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Semantic commits | ${{ steps.commits.outcome }} |"
            echo "| Install | ${{ steps.build.outcome != 'skipped' && '✅' || '⏭' }} |"
            echo "| Type check | ${{ steps.type_check.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            if [[ "${{ inputs.enable_tests }}" == "true" ]]; then
              echo "| Unit tests | ${{ steps.tests.outcome }} |"
            fi
            echo ""
            echo "**Ref:** \`${{ github.sha }}\` on \`${HEAD_REF}\`"
            echo ""
            echo "<details><summary>commands</summary>"
            echo ""
            echo "- install: \`${{ inputs.install_command }}\`"
            echo "- type-check: \`${{ inputs.type_check_command }}\`"
            echo "- lint: \`${{ inputs.lint_command }}\`"
            echo "- build: \`${{ inputs.build_command }}\`"
            echo "- tests: \`${{ inputs.test_command }}\` (enable_tests=${{ inputs.enable_tests }})"
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
