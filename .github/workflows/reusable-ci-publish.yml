name: Reusable — CI Changesets version / npm

# workflow_call only. Changesets library repos only.
# develop prepares and publishes beta versions. main prepares and publishes stable versions.
# Version changes are committed on a review pull request before npm publication.
# The version commit intentionally omits [skip ci]: merging it is what starts publication.
# Application repos use reusable-ci-tag-release.yml and must not call this workflow.

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version.
        type: string
        required: false
        default: '22'
      working_directory:
        description: Working directory for install / Changesets (repo-relative).
        type: string
        required: false
        default: '.'
      npm_scope:
        description: npm scope for setup-node (e.g. '@web-toolkit'). Empty skips scope.
        type: string
        required: false
        default: ''
      version_command:
        description: Command used by changesets/action to apply versions.
        type: string
        required: false
        default: 'npm run version-packages'
      publish_to_npm:
        description: Publish to the public npm registry after versions are in git.
        type: boolean
        required: false
        default: true
      publish_command:
        description: Command used to publish stable versions.
        type: string
        required: false
        default: 'npm run release'
      prerelease_publish_command:
        description: Command used on prerelease_branch (normally publishes with the prerelease npm dist-tag).
        type: string
        required: false
        default: 'npm run release:beta'
      manage_prerelease_mode:
        description: Automatically enter prerelease mode on prerelease_branch and exit it on stable_branch.
        type: boolean
        required: false
        default: true
      stable_branch:
        description: Branch that publishes stable versions.
        type: string
        required: false
        default: 'main'
      prerelease_branch:
        description: Branch that publishes prerelease versions.
        type: string
        required: false
        default: 'develop'
      prerelease_tag:
        description: Changesets prerelease tag and npm dist-tag.
        type: string
        required: false
        default: 'beta'
      version_file:
        description: package.json relative to working_directory. Informational when a version field exists. Publish readiness does not depend on it.
        type: string
        required: false
        default: 'package.json'
      changeset_title:
        description: Title for the Version Packages pull request.
        type: string
        required: false
        default: 'chore: version packages'
      changeset_commit:
        description: Commit message for version bumps.
        type: string
        required: false
        default: 'chore: version packages'
      use_gh_env:
        description: Bind jobs to a GitHub Environment (reviewers / env secrets).
        type: boolean
        required: false
        default: false
      gh_env:
        description: GitHub Environment name when use_gh_env is true (e.g. stage, prod).
        type: string
        required: false
        default: ''

    secrets:
      NPM_TOKEN:
        required: false
      GH_TOKEN:
        required: true

    outputs:
      version_ready:
        description: '"true" when no pending changesets (versions already in git).'
        value: ${{ jobs.version.outputs.version_ready }}
      version:
        description: Semver from version_file when that file has a version field. Empty for private workspace roots.
        value: ${{ jobs.version.outputs.version }}

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_gh_env && inputs.gh_env || '' }}
    outputs:
      version_ready: ${{ steps.gate.outputs.version_ready }}
      version: ${{ steps.gate.outputs.version }}

    steps:
      - name: Log run context
        env:
          LOG_TITLE: Version
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          echo "::notice::${LOG_TITLE} — ${GITHUB_EVENT_NAME} ${GITHUB_REF} sha=${GITHUB_SHA:0:7} run=${GITHUB_RUN_ID}"
          echo "::group::${LOG_TITLE} context"
          cat <<EOF
          event=${GITHUB_EVENT_NAME}
          ref=${GITHUB_REF}
          sha=${GITHUB_SHA}
          actor=${GITHUB_ACTOR}
          run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}
          job=${GITHUB_JOB}
          workflow=${GITHUB_WORKFLOW}
          repository=${GITHUB_REPOSITORY}
          runner=${RUNNER_OS}/${RUNNER_ARCH}
          run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          --- inputs ---
          ${LOG_INPUTS}
          EOF
          [[ -n "${LOG_EXTRA:-}" ]] && { echo "--- extra ---"; echo "${LOG_EXTRA}"; }
          echo "::endgroup::"
          {
            echo "### ${LOG_TITLE}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Event | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| SHA | \`${GITHUB_SHA}\` |"
            echo "| Job | \`${GITHUB_JOB}\` |"
            echo "| Run | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo ""
            echo "<details><summary>inputs</summary>"
            echo ""
            echo '```json'
            echo "${LOG_INPUTS}"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Materialize release model
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-model"
          cat > "$RUNNER_TEMP/release-model/release_model.py" << 'END_RELEASE_MODEL'
          #!/usr/bin/env python3
          """Release planning for library and application repositories."""

          from __future__ import annotations

          import argparse
          import json
          import re
          import sys
          from pathlib import Path


          COMMIT_RE = re.compile(
              r"^(?P<type>fix|feat|docs|chore|ci)"
              r"(?:\([^\r\n)]+\))?(?P<breaking>!)?: (?P<description>\S.*)$"
          )
          VERSION_RE = re.compile(
              r"^(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)"
              r"(?:-(?P<tag>alpha|beta|rc)\.(?P<num>[1-9]\d*))?$"
          )
          CHANGESET_BUMP_RE = re.compile(
              r"^['\"]?(?P<package>.+?)['\"]?\s*:\s*(?P<bump>patch|minor|major)\s*$"
          )
          BUMP_RANK = {"patch": 1, "minor": 2, "major": 3}
          TYPE_BUMP = {"fix": "patch", "feat": "minor", "docs": None, "chore": None, "ci": None}


          def parse_commit(message: str) -> dict:
              """Classify one commit or pull request title."""
              normalized = message.replace("\r\n", "\n").strip()
              subject = normalized.split("\n", 1)[0].strip()
              if (
                  subject.startswith("Merge ")
                  or subject.startswith("chore(release):")
                  or "[skip ci]" in subject
                  or "[skip actions]" in subject
              ):
                  return {"ignored": True, "valid": True, "subject": subject, "bump": None}
              match = COMMIT_RE.fullmatch(subject)
              if not match:
                  return {"ignored": False, "valid": False, "subject": subject, "bump": None}
              breaking = match.group("breaking") == "!" or any(
                  line.startswith("BREAKING CHANGE:") or line.startswith("BREAKING-CHANGE:")
                  for line in normalized.split("\n")[1:]
              )
              bump = "major" if breaking else TYPE_BUMP[match.group("type")]
              return {
                  "ignored": False,
                  "valid": True,
                  "subject": subject,
                  "type": match.group("type"),
                  "bump": bump,
              }


          def highest_bump(commits: list[dict]) -> str | None:
              best = None
              for commit in commits:
                  bump = commit.get("bump")
                  if bump and (best is None or BUMP_RANK[bump] > BUMP_RANK[best]):
                      best = bump
              return best


          def parse_version(value: str) -> dict:
              match = VERSION_RE.fullmatch(value.strip())
              if not match:
                  raise ValueError(
                      f"Unsupported version '{value}'. Expected X.Y.Z or X.Y.Z-(alpha|beta|rc).N with N starting at 1."
                  )
              return {
                  "major": int(match.group("major")),
                  "minor": int(match.group("minor")),
                  "patch": int(match.group("patch")),
                  "tag": match.group("tag"),
                  "num": int(match.group("num")) if match.group("num") else None,
              }


          def format_stable(version: dict) -> str:
              return f"{version['major']}.{version['minor']}.{version['patch']}"


          def version_sort_key(value: str) -> tuple:
              parsed = parse_version(value)
              return (
                  parsed["major"],
                  parsed["minor"],
                  parsed["patch"],
                  1 if parsed["tag"] is None else 0,
                  parsed["num"] or 0,
              )


          def apply_bump(version: dict, bump: str) -> dict:
              major, minor, patch = version["major"], version["minor"], version["patch"]
              if bump == "major":
                  return {"major": major + 1, "minor": 0, "patch": 0, "tag": None, "num": None}
              if bump == "minor":
                  return {"major": major, "minor": minor + 1, "patch": 0, "tag": None, "num": None}
              if bump == "patch":
                  return {"major": major, "minor": minor, "patch": patch + 1, "tag": None, "num": None}
              raise ValueError(f"Unknown bump '{bump}'")


          def line_bump(last_stable: dict, beta_base: dict) -> str:
              if beta_base["major"] > last_stable["major"]:
                  return "major"
              if beta_base["minor"] > last_stable["minor"]:
                  return "minor"
              return "patch"


          def releasable_subjects(commits: list[dict]) -> list[str]:
              return [commit["subject"] for commit in commits if commit.get("bump")]


          def select_baseline(payload: dict) -> str | None:
              """Return the tag whose history has already been released."""
              branch = payload["branch"]
              stable_branch = payload.get("stable_branch", "main")
              prerelease_branch = payload.get("prerelease_branch", "develop")
              tag_name = payload.get("prerelease_tag", "beta")
              last_stable = parse_version(payload["last_stable"])
              merged = [parse_version(value) for value in payload.get("merged_tags", [])]
              if branch == prerelease_branch:
                  if not merged:
                      return None
                  return format_version(max(merged, key=lambda item: version_sort_key(format_version(item))))
              betas = [
                  item
                  for item in merged
                  if item["tag"] == tag_name
                  and version_sort_key(format_stable(item)) > version_sort_key(format_stable(last_stable))
              ]
              if betas:
                  return format_version(max(betas, key=lambda item: version_sort_key(format_version(item))))
              stables = [item for item in merged if item["tag"] is None]
              if not stables:
                  return None
              return format_version(max(stables, key=lambda item: version_sort_key(format_version(item))))


          def plan_release(payload: dict) -> dict:
              """Plan one application release from tags and commits since the latest tag."""
              branch = payload["branch"]
              stable_branch = payload.get("stable_branch", "main")
              prerelease_branch = payload.get("prerelease_branch", "develop")
              tag_name = payload.get("prerelease_tag", "beta")
              if tag_name not in {"alpha", "beta", "rc"}:
                  raise ValueError("prerelease_tag must be alpha, beta, or rc")
              if branch not in {stable_branch, prerelease_branch}:
                  raise ValueError(
                      f"Branch '{branch}' is neither {stable_branch} nor {prerelease_branch}"
                  )

              explicit = str(payload.get("explicit_version") or "").strip()
              if explicit.startswith("v"):
                  explicit = explicit[1:]
              if explicit:
                  parsed = parse_version(explicit)
                  prerelease = parsed["tag"] is not None
                  if branch == prerelease_branch and not prerelease:
                      raise ValueError(f"{prerelease_branch} can only create beta releases")
                  if branch == stable_branch and prerelease:
                      raise ValueError(f"{stable_branch} can only create stable releases")
                  return {
                      "action": "release",
                      "version": explicit,
                      "prerelease": prerelease,
                      "commits": [],
                  }

              commits = [parse_commit(message) for message in payload.get("commits", [])]
              invalid = [commit["subject"] for commit in commits if not commit["valid"]]
              if invalid:
                  raise ValueError("Invalid commit titles: " + "; ".join(invalid))
              new_bump = highest_bump(commits)
              last_stable = parse_version(payload["last_stable"])
              if last_stable["tag"]:
                  raise ValueError("last_stable must be a stable X.Y.Z version")

              merged = [parse_version(value) for value in payload.get("merged_tags", [])]
              latest = max(merged, key=lambda item: version_sort_key(format_version(item)), default=None)
              if branch == prerelease_branch:
                  if new_bump is None:
                      return {"action": "skip", "reason": "No releasable commits since the latest tag"}
                  if latest and latest["tag"] == tag_name and BUMP_RANK[new_bump] <= BUMP_RANK[line_bump(last_stable, latest)]:
                      version = f"{format_stable(latest)}-{tag_name}.{latest['num'] + 1}"
                  else:
                      version = f"{format_stable(apply_bump(last_stable, new_bump))}-{tag_name}.1"
                  return {
                      "action": "release",
                      "version": version,
                      "prerelease": True,
                      "commits": releasable_subjects(commits),
                  }

              betas = [
                  item
                  for item in merged
                  if item["tag"] == tag_name and version_sort_key(format_stable(item)) > version_sort_key(format_stable(last_stable))
              ]
              best_beta = max(betas, key=lambda item: version_sort_key(format_version(item)), default=None)
              if new_bump is None and best_beta is not None:
                  return {
                      "action": "release",
                      "version": format_stable(best_beta),
                      "prerelease": False,
                      "commits": [f"Promote {format_version(best_beta)}"],
                  }
              if new_bump is None:
                  return {"action": "skip", "reason": "No releasable commits since the latest stable tag"}
              base = best_beta if best_beta is not None else last_stable
              version = format_stable(apply_bump(base, new_bump))
              return {"action": "release", "version": version, "prerelease": False, "commits": releasable_subjects(commits)}


          def format_version(version: dict) -> str:
              stable = format_stable(version)
              if version["tag"] is None:
                  return stable
              return f"{stable}-{version['tag']}.{version['num']}"


          def update_changelog(existing: str, version: str, subjects: list[str]) -> str:
              lines = [f"## {version}", ""]
              if subjects:
                  lines.extend(f"- {subject}" for subject in subjects)
              else:
                  lines.append(f"- Release {version}")
              lines.append("")
              section = "\n".join(lines)
              text = existing.strip()
              if not text:
                  return f"# Changelog\n\n{section}"
              if text.startswith("# "):
                  heading, _, rest = text.partition("\n")
                  return f"{heading}\n\n{section}{rest.lstrip()}"
              return f"{section}{text}"


          def set_package_version(text: str, version: str) -> str:
              updated, count = re.subn(
                  r'("version"\s*:\s*")[^"]+"',
                  rf'\g<1>{version}"',
                  text,
                  count=1,
              )
              if count != 1:
                  raise ValueError("package.json does not contain a version field")
              return updated


          def parse_changeset_bumps(text: str) -> list[str]:
              if not text.lstrip().startswith("---"):
                  return []
              parts = text.split("---", 2)
              if len(parts) < 3:
                  return []
              bumps = []
              for line in parts[1].splitlines():
                  match = CHANGESET_BUMP_RE.match(line.strip())
                  if match:
                      bumps.append(match.group("bump"))
              return bumps


          def validate_pull_request(payload: dict) -> list[str]:
              """Return release-policy errors for one pull request."""
              errors = []
              title = parse_commit(payload.get("title") or "")
              if not title["valid"]:
                  errors.append(
                      "Pull request title must be a conventional commit: "
                      "fix:, feat:, feat!:, docs:, chore:, or ci:."
                  )
              commits = [parse_commit(message) for message in payload.get("commits", [])]
              for commit in commits:
                  if not commit["valid"]:
                      errors.append(f"Invalid commit title: {commit['subject']}")
              if payload.get("skip_changeset"):
                  return errors

              bump = highest_bump([title, *commits])
              changeset_bumps = []
              for changeset in payload.get("changesets", []):
                  changeset_bumps.extend(parse_changeset_bumps(changeset))
              declared = highest_bump([{"bump": bump_name, "valid": True} for bump_name in changeset_bumps])
              packages_changed = bool(payload.get("packages_changed"))

              if bump is None and declared is not None:
                  errors.append("docs:, chore:, and ci: changes cannot include a release changeset")
              elif bump is not None and packages_changed and declared is None:
                  errors.append(
                      "Package changes require a changeset that declares patch, minor, or major"
                  )
              elif bump is not None and declared is not None and declared != bump:
                  errors.append(
                      f"Changeset bump '{declared}' does not match conventional commit bump '{bump}'"
                  )
              return errors


          def iter_package_json(root: Path) -> list[Path]:
              return [
                  path
                  for path in root.rglob("package.json")
                  if "node_modules" not in path.parts
              ]


          def public_versions(root: Path) -> list[dict]:
              """Return publishable packages. Private packages and nameless workspace roots are omitted."""
              found = []
              for path in iter_package_json(root):
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      continue
                  name = data.get("name")
                  version = data.get("version")
                  if data.get("private") is True or not name or not version:
                      continue
                  found.append({"name": name, "version": str(version), "path": str(path)})
              return found


          def assert_library_versions(root: Path, *, prerelease: bool, tag: str) -> None:
              """Fail when develop would publish a stable version or main would publish a beta."""
              pattern = (
                  rf"^\d+\.\d+\.\d+-{re.escape(tag)}\.[1-9]\d*$"
                  if prerelease
                  else r"^\d+\.\d+\.\d+$"
              )
              errors = []
              for package in public_versions(root):
                  if not re.fullmatch(pattern, package["version"]):
                      expected = f"{tag}.N starting at 1" if prerelease else "stable X.Y.Z"
                      errors.append(f"{package['name']}@{package['version']} is not a {expected} release")
              if errors:
                  raise ValueError("; ".join(errors))


          def shift_initial_prerelease(root: Path, tag: str) -> list[str]:
              """Move Changesets' initial X.Y.Z-tag.0 versions to X.Y.Z-tag.1."""
              package_files = iter_package_json(root)
              versions = []
              for path in package_files:
                  try:
                      version = json.loads(path.read_text(encoding="utf-8")).get("version", "")
                  except (OSError, json.JSONDecodeError):
                      continue
                  if re.fullmatch(rf"\d+\.\d+\.\d+-{re.escape(tag)}\.0", str(version)):
                      versions.append(str(version))
              if not versions:
                  return []

              candidates = []
              for pattern in ("package.json", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml", "CHANGELOG.md"):
                  candidates.extend(path for path in root.rglob(pattern) if "node_modules" not in path.parts)
              changed = []
              for path in sorted(set(candidates)):
                  text = path.read_text(encoding="utf-8")
                  updated = text
                  for version in versions:
                      updated = updated.replace(version, f"{version[:-1]}1")
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")
                      changed.append(str(path))
              return changed


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser()
              commands = parser.add_subparsers(dest="command", required=True)
              plan = commands.add_parser("plan")
              plan.add_argument("payload")
              baseline = commands.add_parser("baseline")
              baseline.add_argument("payload")
              validate = commands.add_parser("validate-pr")
              validate.add_argument("payload")
              apply = commands.add_parser("apply")
              apply.add_argument("--version", required=True)
              apply.add_argument("--version-file", required=True)
              apply.add_argument("--changelog", required=True)
              apply.add_argument("--subjects-file", required=True)
              shift = commands.add_parser("shift-prerelease")
              shift.add_argument("--root", required=True)
              shift.add_argument("--tag", required=True)
              return parser


          def main(argv: list[str]) -> int:
              args = build_parser().parse_args(argv)
              if args.command == "plan":
                  result = plan_release(json.loads(Path(args.payload).read_text(encoding="utf-8")))
                  print(json.dumps(result))
                  return 0
              if args.command == "baseline":
                  print(select_baseline(json.loads(Path(args.payload).read_text(encoding="utf-8"))) or "")
                  return 0
              if args.command == "validate-pr":
                  errors = validate_pull_request(json.loads(Path(args.payload).read_text(encoding="utf-8")))
                  if errors:
                      for error in errors:
                          print(f"::error::{error}", file=sys.stderr)
                      return 1
                  print("Release pull request policy passed")
                  return 0
              if args.command == "apply":
                  version_path = Path(args.version_file)
                  version_path.write_text(
                      set_package_version(version_path.read_text(encoding="utf-8"), args.version),
                      encoding="utf-8",
                  )
                  changelog_path = Path(args.changelog)
                  subjects = [
                      line
                      for line in Path(args.subjects_file).read_text(encoding="utf-8").splitlines()
                      if line.strip()
                  ]
                  existing = changelog_path.read_text(encoding="utf-8") if changelog_path.exists() else ""
                  changelog_path.write_text(
                      update_changelog(existing, args.version, subjects) + "\n",
                      encoding="utf-8",
                  )
                  return 0
              changed = shift_initial_prerelease(Path(args.root), args.tag)
              print(json.dumps(changed))
              return 0


          if __name__ == "__main__":
              try:
                  sys.exit(main(sys.argv[1:]))
              except ValueError as exc:
                  print(f"::error::{exc}", file=sys.stderr)
                  sys.exit(1)
END_RELEASE_MODEL


      - name: Write version command
        env:
          VERSION_COMMAND: ${{ inputs.version_command }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: |
          cat > "$RUNNER_TEMP/version-packages.sh" << 'EOF'
          #!/bin/bash
          set -euo pipefail
          bash -euo pipefail -c "$VERSION_COMMAND"
          python3 -c 'import os; from pathlib import Path; import release_model; release_model.shift_initial_prerelease(Path(".").resolve(), os.environ["PRERELEASE_TAG"])'
          EOF
          chmod +x "$RUNNER_TEMP/version-packages.sh"

      - name: Remember repository npmrc
        id: npmrc
        run: |
          set -euo pipefail
          if [[ -f .npmrc ]]; then
            cp .npmrc /tmp/repo-npmrc
            echo "existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory == '.' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working_directory) }}
          registry-url: https://registry.npmjs.org
          scope: ${{ inputs.npm_scope }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Restore repository npmrc
        env:
          NPMRC_EXISTED: ${{ steps.npmrc.outputs.existed }}
        run: |
          set -euo pipefail
          if [[ "$NPMRC_EXISTED" == "true" ]]; then
            cp /tmp/repo-npmrc .npmrc
          else
            rm -f .npmrc
          fi

      - name: Inspect pending changesets
        id: pending
        env:
          WORK_DIR: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail

          CS_DIR="${WORK_DIR}/.changeset"
          [[ "$WORK_DIR" == "." ]] && CS_DIR=".changeset"
          if [[ ! -d "$CS_DIR" ]]; then
            echo "::error::Changesets directory not found: $CS_DIR"
            exit 1
          fi

          PENDING=0
          while IFS= read -r -d '' file; do
            [[ "$(basename "$file")" == "README.md" ]] && continue
            PENDING=$((PENDING + 1))
          done < <(find "$CS_DIR" -maxdepth 1 -type f -name '*.md' -print0)

          echo "count=$PENDING" >> "$GITHUB_OUTPUT"
          echo "::notice::Pending changesets before versioning: $PENDING"

      - name: Configure Changesets prerelease mode
        id: pre_mode
        if: ${{ inputs.manage_prerelease_mode }}
        working-directory: ${{ inputs.working_directory }}
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          PRERELEASE_BRANCH: ${{ inputs.prerelease_branch }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          PENDING_COUNT: ${{ steps.pending.outputs.count }}
        run: |
          set -euo pipefail

          PRE_FILE=".changeset/pre.json"
          TRANSITION="none"

          if [[ "$CURRENT_BRANCH" == "$PRERELEASE_BRANCH" ]]; then
            if [[ -f "$PRE_FILE" ]]; then
              MODE=$(jq -r '.mode // empty' "$PRE_FILE")
              TAG=$(jq -r '.tag // empty' "$PRE_FILE")
              if [[ "$MODE" != "pre" || "$TAG" != "$PRERELEASE_TAG" ]]; then
                echo "::error::$PRE_FILE must use mode=pre and tag=$PRERELEASE_TAG on $PRERELEASE_BRANCH"
                exit 1
              fi
              echo "::notice::$PRERELEASE_BRANCH is already in $PRERELEASE_TAG prerelease mode"
            elif [[ "$PENDING_COUNT" -gt 0 ]]; then
              npx changeset pre enter "$PRERELEASE_TAG"
              TRANSITION="enter"
              echo "::notice::Entered $PRERELEASE_TAG prerelease mode on $PRERELEASE_BRANCH"
            else
              echo "::notice::No pending changesets; prerelease mode will begin with the next release change"
            fi
          elif [[ "$CURRENT_BRANCH" == "$STABLE_BRANCH" && -f "$PRE_FILE" ]]; then
            MODE=$(jq -r '.mode // empty' "$PRE_FILE")
            if [[ "$MODE" == "pre" ]]; then
              npx changeset pre exit
              TRANSITION="exit"
              echo "::notice::Exiting prerelease mode on $STABLE_BRANCH"
            elif [[ "$MODE" == "exit" ]]; then
              TRANSITION="exit"
              echo "::notice::Prerelease exit is already pending on $STABLE_BRANCH"
            else
              echo "::error::Unsupported Changesets prerelease mode '$MODE' in $PRE_FILE"
              exit 1
            fi
          fi

          echo "transition=$TRANSITION" >> "$GITHUB_OUTPUT"

      - name: Open Version Packages pull request for prerelease transition
        if: ${{ steps.pre_mode.outputs.transition == 'exit' && steps.pending.outputs.count == '0' }}
        working-directory: ${{ inputs.working_directory }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          VERSION_COMMAND: ${{ inputs.version_command }}
          PR_TITLE: ${{ inputs.changeset_title }}
          PR_COMMIT: ${{ inputs.changeset_commit }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          PYTHONPATH: ${{ runner.temp }}/release-model
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          if [[ -z "$VERSION_COMMAND" ]]; then
            echo "::error::version_command is empty"
            exit 1
          fi

          bash "$RUNNER_TEMP/version-packages.sh"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Prerelease transition did not change the tree, so no Version Packages pull request was opened."
            exit 1
          fi

          BRANCH="changeset-release/${CURRENT_BRANCH}"
          git checkout -B "$BRANCH"
          git commit -m "$PR_COMMIT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git push --force-with-lease origin "HEAD:${BRANCH}"
          else
            git push origin "HEAD:${BRANCH}"
          fi

          if gh pr view "$BRANCH" --repo "$GH_REPO" --json url --jq .url >/dev/null 2>&1; then
            echo "::notice::Updated Version Packages pull request for ${BRANCH}"
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base "$CURRENT_BRANCH" \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body "Changesets prerelease transition. Review the version and changelog updates, then merge."
            echo "::notice::Opened Version Packages pull request for ${BRANCH}"
          fi

      - name: Version Packages pull request
        if: ${{ steps.pending.outputs.count != '0' }}
        uses: changesets/action@v2
        with:
          cwd: ${{ inputs.working_directory }}
          version: bash "$RUNNER_TEMP/version-packages.sh"
          commit: ${{ inputs.changeset_commit }}
          title: ${{ inputs.changeset_title }}
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION_COMMAND: ${{ inputs.version_command }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          PYTHONPATH: ${{ runner.temp }}/release-model

      - name: Decide if version is ready
        id: gate
        env:
          WORK_DIR: ${{ inputs.working_directory }}
          VERSION_FILE: ${{ inputs.version_file }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          PRERELEASE_BRANCH: ${{ inputs.prerelease_branch }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          MANAGE_PRERELEASE: ${{ inputs.manage_prerelease_mode }}
          PENDING: ${{ steps.pending.outputs.count }}
          PRE_TRANSITION: ${{ steps.pre_mode.outputs.transition || 'none' }}
        run: |
          set -euo pipefail

          write_output() {
            local ready="$1"
            local version="$2"
            {
              echo "version_ready=${ready}"
              echo "version<<VERSION_EOF"
              echo "$version"
              echo "VERSION_EOF"
            } >> "$GITHUB_OUTPUT"
          }

          CS_DIR=".changeset"
          if [[ "$WORK_DIR" != "." ]]; then
            CS_DIR="${WORK_DIR}/.changeset"
          fi

          PENDING_LIST=""
          if [[ -d "$CS_DIR" ]]; then
            echo "::group::Changeset directory ${CS_DIR}"
            ls -la "$CS_DIR" || true
            echo "::endgroup::"
            while IFS= read -r -d '' file; do
              base=$(basename "$file")
              if [[ "$base" == "README.md" ]]; then
                continue
              fi
              PENDING_LIST="${PENDING_LIST}${base}"$'\n'
            done < <(find "$CS_DIR" -maxdepth 1 -type f -name '*.md' -print0 2>/dev/null || true)
          fi

          if [[ "$REF_TYPE" != "branch" || ( "$CURRENT_BRANCH" != "$STABLE_BRANCH" && "$CURRENT_BRANCH" != "$PRERELEASE_BRANCH" ) ]]; then
            echo "::error::Ref '$CURRENT_BRANCH' ($REF_TYPE) is neither $STABLE_BRANCH nor $PRERELEASE_BRANCH."
            exit 1
          fi

          if [[ "$PENDING" -gt 0 || "$PRE_TRANSITION" != "none" ]]; then
            write_output false ""
            echo "::notice::Release changes detected (changesets=$PENDING prerelease_transition=$PRE_TRANSITION); Version Packages PR only."
            echo "::group::Pending changeset files"
            printf '%s' "$PENDING_LIST"
            echo "::endgroup::"
            {
              echo "### Version gate"
              echo ""
              echo "version_ready: \`false\` — $PENDING pending changeset(s), prerelease transition \`$PRE_TRANSITION\`."
              echo ""
              echo '```'
              printf '%s' "$PENDING_LIST"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PRE_FILE="${CS_DIR}/pre.json"
          PRE_MODE=""
          PRE_TAG=""
          if [[ -f "$PRE_FILE" ]]; then
            PRE_MODE=$(jq -r '.mode // empty' "$PRE_FILE")
            PRE_TAG=$(jq -r '.tag // empty' "$PRE_FILE")
          fi

          if [[ "$CURRENT_BRANCH" == "$PRERELEASE_BRANCH" ]]; then
            if [[ "$MANAGE_PRERELEASE" == "true" && ( "$PRE_MODE" != "pre" || "$PRE_TAG" != "$PRERELEASE_TAG" ) ]]; then
              write_output false ""
              echo "::notice::$PRERELEASE_BRANCH is not in $PRERELEASE_TAG prerelease mode yet."
              exit 0
            fi
          elif [[ -f "$PRE_FILE" ]]; then
            echo "::error::$STABLE_BRANCH still has $PRE_FILE (mode=$PRE_MODE). Refusing to publish a prerelease as latest."
            exit 1
          fi

          VERSION=""
          VERSION_PATH="$VERSION_FILE"
          if [[ "$WORK_DIR" != "." && "$VERSION_FILE" != /* ]]; then
            VERSION_PATH="${WORK_DIR}/${VERSION_FILE}"
          fi
          if [[ -f "$VERSION_PATH" ]]; then
            VERSION=$(jq -r '.version // empty' "$VERSION_PATH")
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              VERSION=""
            fi
          fi

          write_output true "$VERSION"
          echo "::notice::Version ready for publish on $CURRENT_BRANCH"
          {
            echo "### Version gate"
            echo ""
            echo "version_ready: \`true\`"
            echo "prerelease mode: \`${PRE_MODE:-none}\`"
            if [[ -n "$VERSION" ]]; then
              echo "version file: \`$VERSION\` from \`$VERSION_PATH\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  npm:
    name: Publish npm
    needs: version
    if: ${{ inputs.publish_to_npm && needs.version.outputs.version_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_gh_env && inputs.gh_env || '' }}

    steps:
      - name: Log run context
        env:
          LOG_TITLE: Publish npm
          LOG_INPUTS: ${{ toJSON(inputs) }}
          LOG_EXTRA: |
            version=${{ needs.version.outputs.version }}
            version_ready=${{ needs.version.outputs.version_ready }}
            branch=${{ github.ref_name }}
            npm_token_present=${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "::notice::${LOG_TITLE} — ${GITHUB_EVENT_NAME} ${GITHUB_REF} sha=${GITHUB_SHA:0:7} run=${GITHUB_RUN_ID}"
          echo "::group::${LOG_TITLE} context"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "actor=${GITHUB_ACTOR}"
          echo "run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
          echo "job=${GITHUB_JOB} workflow=${GITHUB_WORKFLOW}"
          echo "repository=${GITHUB_REPOSITORY}"
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          echo "--- inputs ---"
          echo "${LOG_INPUTS}"
          echo "--- extra ---"
          echo "${LOG_EXTRA}"
          echo "::endgroup::"
          {
            echo "### ${LOG_TITLE}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | \`${{ needs.version.outputs.version }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| stable command | \`${{ inputs.publish_command }}\` |"
            echo "| prerelease command | \`${{ inputs.prerelease_publish_command }}\` |"
            echo "| npm token present | \`${{ secrets.NPM_TOKEN != '' }}\` |"
            echo "| Job | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "::error::NPM_TOKEN is required when publish_to_npm is true"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Materialize release model
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release-model"
          cat > "$RUNNER_TEMP/release-model/release_model.py" << 'END_RELEASE_MODEL'
          #!/usr/bin/env python3
          """Release planning for library and application repositories."""

          from __future__ import annotations

          import argparse
          import json
          import re
          import sys
          from pathlib import Path


          COMMIT_RE = re.compile(
              r"^(?P<type>fix|feat|docs|chore|ci)"
              r"(?:\([^\r\n)]+\))?(?P<breaking>!)?: (?P<description>\S.*)$"
          )
          VERSION_RE = re.compile(
              r"^(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)"
              r"(?:-(?P<tag>alpha|beta|rc)\.(?P<num>[1-9]\d*))?$"
          )
          CHANGESET_BUMP_RE = re.compile(
              r"^['\"]?(?P<package>.+?)['\"]?\s*:\s*(?P<bump>patch|minor|major)\s*$"
          )
          BUMP_RANK = {"patch": 1, "minor": 2, "major": 3}
          TYPE_BUMP = {"fix": "patch", "feat": "minor", "docs": None, "chore": None, "ci": None}


          def parse_commit(message: str) -> dict:
              """Classify one commit or pull request title."""
              normalized = message.replace("\r\n", "\n").strip()
              subject = normalized.split("\n", 1)[0].strip()
              if (
                  subject.startswith("Merge ")
                  or subject.startswith("chore(release):")
                  or "[skip ci]" in subject
                  or "[skip actions]" in subject
              ):
                  return {"ignored": True, "valid": True, "subject": subject, "bump": None}
              match = COMMIT_RE.fullmatch(subject)
              if not match:
                  return {"ignored": False, "valid": False, "subject": subject, "bump": None}
              breaking = match.group("breaking") == "!" or any(
                  line.startswith("BREAKING CHANGE:") or line.startswith("BREAKING-CHANGE:")
                  for line in normalized.split("\n")[1:]
              )
              bump = "major" if breaking else TYPE_BUMP[match.group("type")]
              return {
                  "ignored": False,
                  "valid": True,
                  "subject": subject,
                  "type": match.group("type"),
                  "bump": bump,
              }


          def highest_bump(commits: list[dict]) -> str | None:
              best = None
              for commit in commits:
                  bump = commit.get("bump")
                  if bump and (best is None or BUMP_RANK[bump] > BUMP_RANK[best]):
                      best = bump
              return best


          def parse_version(value: str) -> dict:
              match = VERSION_RE.fullmatch(value.strip())
              if not match:
                  raise ValueError(
                      f"Unsupported version '{value}'. Expected X.Y.Z or X.Y.Z-(alpha|beta|rc).N with N starting at 1."
                  )
              return {
                  "major": int(match.group("major")),
                  "minor": int(match.group("minor")),
                  "patch": int(match.group("patch")),
                  "tag": match.group("tag"),
                  "num": int(match.group("num")) if match.group("num") else None,
              }


          def format_stable(version: dict) -> str:
              return f"{version['major']}.{version['minor']}.{version['patch']}"


          def version_sort_key(value: str) -> tuple:
              parsed = parse_version(value)
              return (
                  parsed["major"],
                  parsed["minor"],
                  parsed["patch"],
                  1 if parsed["tag"] is None else 0,
                  parsed["num"] or 0,
              )


          def apply_bump(version: dict, bump: str) -> dict:
              major, minor, patch = version["major"], version["minor"], version["patch"]
              if bump == "major":
                  return {"major": major + 1, "minor": 0, "patch": 0, "tag": None, "num": None}
              if bump == "minor":
                  return {"major": major, "minor": minor + 1, "patch": 0, "tag": None, "num": None}
              if bump == "patch":
                  return {"major": major, "minor": minor, "patch": patch + 1, "tag": None, "num": None}
              raise ValueError(f"Unknown bump '{bump}'")


          def line_bump(last_stable: dict, beta_base: dict) -> str:
              if beta_base["major"] > last_stable["major"]:
                  return "major"
              if beta_base["minor"] > last_stable["minor"]:
                  return "minor"
              return "patch"


          def releasable_subjects(commits: list[dict]) -> list[str]:
              return [commit["subject"] for commit in commits if commit.get("bump")]


          def select_baseline(payload: dict) -> str | None:
              """Return the tag whose history has already been released."""
              branch = payload["branch"]
              stable_branch = payload.get("stable_branch", "main")
              prerelease_branch = payload.get("prerelease_branch", "develop")
              tag_name = payload.get("prerelease_tag", "beta")
              last_stable = parse_version(payload["last_stable"])
              merged = [parse_version(value) for value in payload.get("merged_tags", [])]
              if branch == prerelease_branch:
                  if not merged:
                      return None
                  return format_version(max(merged, key=lambda item: version_sort_key(format_version(item))))
              betas = [
                  item
                  for item in merged
                  if item["tag"] == tag_name
                  and version_sort_key(format_stable(item)) > version_sort_key(format_stable(last_stable))
              ]
              if betas:
                  return format_version(max(betas, key=lambda item: version_sort_key(format_version(item))))
              stables = [item for item in merged if item["tag"] is None]
              if not stables:
                  return None
              return format_version(max(stables, key=lambda item: version_sort_key(format_version(item))))


          def plan_release(payload: dict) -> dict:
              """Plan one application release from tags and commits since the latest tag."""
              branch = payload["branch"]
              stable_branch = payload.get("stable_branch", "main")
              prerelease_branch = payload.get("prerelease_branch", "develop")
              tag_name = payload.get("prerelease_tag", "beta")
              if tag_name not in {"alpha", "beta", "rc"}:
                  raise ValueError("prerelease_tag must be alpha, beta, or rc")
              if branch not in {stable_branch, prerelease_branch}:
                  raise ValueError(
                      f"Branch '{branch}' is neither {stable_branch} nor {prerelease_branch}"
                  )

              explicit = str(payload.get("explicit_version") or "").strip()
              if explicit.startswith("v"):
                  explicit = explicit[1:]
              if explicit:
                  parsed = parse_version(explicit)
                  prerelease = parsed["tag"] is not None
                  if branch == prerelease_branch and not prerelease:
                      raise ValueError(f"{prerelease_branch} can only create beta releases")
                  if branch == stable_branch and prerelease:
                      raise ValueError(f"{stable_branch} can only create stable releases")
                  return {
                      "action": "release",
                      "version": explicit,
                      "prerelease": prerelease,
                      "commits": [],
                  }

              commits = [parse_commit(message) for message in payload.get("commits", [])]
              invalid = [commit["subject"] for commit in commits if not commit["valid"]]
              if invalid:
                  raise ValueError("Invalid commit titles: " + "; ".join(invalid))
              new_bump = highest_bump(commits)
              last_stable = parse_version(payload["last_stable"])
              if last_stable["tag"]:
                  raise ValueError("last_stable must be a stable X.Y.Z version")

              merged = [parse_version(value) for value in payload.get("merged_tags", [])]
              latest = max(merged, key=lambda item: version_sort_key(format_version(item)), default=None)
              if branch == prerelease_branch:
                  if new_bump is None:
                      return {"action": "skip", "reason": "No releasable commits since the latest tag"}
                  if latest and latest["tag"] == tag_name and BUMP_RANK[new_bump] <= BUMP_RANK[line_bump(last_stable, latest)]:
                      version = f"{format_stable(latest)}-{tag_name}.{latest['num'] + 1}"
                  else:
                      version = f"{format_stable(apply_bump(last_stable, new_bump))}-{tag_name}.1"
                  return {
                      "action": "release",
                      "version": version,
                      "prerelease": True,
                      "commits": releasable_subjects(commits),
                  }

              betas = [
                  item
                  for item in merged
                  if item["tag"] == tag_name and version_sort_key(format_stable(item)) > version_sort_key(format_stable(last_stable))
              ]
              best_beta = max(betas, key=lambda item: version_sort_key(format_version(item)), default=None)
              if new_bump is None and best_beta is not None:
                  return {
                      "action": "release",
                      "version": format_stable(best_beta),
                      "prerelease": False,
                      "commits": [f"Promote {format_version(best_beta)}"],
                  }
              if new_bump is None:
                  return {"action": "skip", "reason": "No releasable commits since the latest stable tag"}
              base = best_beta if best_beta is not None else last_stable
              version = format_stable(apply_bump(base, new_bump))
              return {"action": "release", "version": version, "prerelease": False, "commits": releasable_subjects(commits)}


          def format_version(version: dict) -> str:
              stable = format_stable(version)
              if version["tag"] is None:
                  return stable
              return f"{stable}-{version['tag']}.{version['num']}"


          def update_changelog(existing: str, version: str, subjects: list[str]) -> str:
              lines = [f"## {version}", ""]
              if subjects:
                  lines.extend(f"- {subject}" for subject in subjects)
              else:
                  lines.append(f"- Release {version}")
              lines.append("")
              section = "\n".join(lines)
              text = existing.strip()
              if not text:
                  return f"# Changelog\n\n{section}"
              if text.startswith("# "):
                  heading, _, rest = text.partition("\n")
                  return f"{heading}\n\n{section}{rest.lstrip()}"
              return f"{section}{text}"


          def set_package_version(text: str, version: str) -> str:
              updated, count = re.subn(
                  r'("version"\s*:\s*")[^"]+"',
                  rf'\g<1>{version}"',
                  text,
                  count=1,
              )
              if count != 1:
                  raise ValueError("package.json does not contain a version field")
              return updated


          def parse_changeset_bumps(text: str) -> list[str]:
              if not text.lstrip().startswith("---"):
                  return []
              parts = text.split("---", 2)
              if len(parts) < 3:
                  return []
              bumps = []
              for line in parts[1].splitlines():
                  match = CHANGESET_BUMP_RE.match(line.strip())
                  if match:
                      bumps.append(match.group("bump"))
              return bumps


          def validate_pull_request(payload: dict) -> list[str]:
              """Return release-policy errors for one pull request."""
              errors = []
              title = parse_commit(payload.get("title") or "")
              if not title["valid"]:
                  errors.append(
                      "Pull request title must be a conventional commit: "
                      "fix:, feat:, feat!:, docs:, chore:, or ci:."
                  )
              commits = [parse_commit(message) for message in payload.get("commits", [])]
              for commit in commits:
                  if not commit["valid"]:
                      errors.append(f"Invalid commit title: {commit['subject']}")
              if payload.get("skip_changeset"):
                  return errors

              bump = highest_bump([title, *commits])
              changeset_bumps = []
              for changeset in payload.get("changesets", []):
                  changeset_bumps.extend(parse_changeset_bumps(changeset))
              declared = highest_bump([{"bump": bump_name, "valid": True} for bump_name in changeset_bumps])
              packages_changed = bool(payload.get("packages_changed"))

              if bump is None and declared is not None:
                  errors.append("docs:, chore:, and ci: changes cannot include a release changeset")
              elif bump is not None and packages_changed and declared is None:
                  errors.append(
                      "Package changes require a changeset that declares patch, minor, or major"
                  )
              elif bump is not None and declared is not None and declared != bump:
                  errors.append(
                      f"Changeset bump '{declared}' does not match conventional commit bump '{bump}'"
                  )
              return errors


          def iter_package_json(root: Path) -> list[Path]:
              return [
                  path
                  for path in root.rglob("package.json")
                  if "node_modules" not in path.parts
              ]


          def public_versions(root: Path) -> list[dict]:
              """Return publishable packages. Private packages and nameless workspace roots are omitted."""
              found = []
              for path in iter_package_json(root):
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      continue
                  name = data.get("name")
                  version = data.get("version")
                  if data.get("private") is True or not name or not version:
                      continue
                  found.append({"name": name, "version": str(version), "path": str(path)})
              return found


          def assert_library_versions(root: Path, *, prerelease: bool, tag: str) -> None:
              """Fail when develop would publish a stable version or main would publish a beta."""
              pattern = (
                  rf"^\d+\.\d+\.\d+-{re.escape(tag)}\.[1-9]\d*$"
                  if prerelease
                  else r"^\d+\.\d+\.\d+$"
              )
              errors = []
              for package in public_versions(root):
                  if not re.fullmatch(pattern, package["version"]):
                      expected = f"{tag}.N starting at 1" if prerelease else "stable X.Y.Z"
                      errors.append(f"{package['name']}@{package['version']} is not a {expected} release")
              if errors:
                  raise ValueError("; ".join(errors))


          def shift_initial_prerelease(root: Path, tag: str) -> list[str]:
              """Move Changesets' initial X.Y.Z-tag.0 versions to X.Y.Z-tag.1."""
              package_files = iter_package_json(root)
              versions = []
              for path in package_files:
                  try:
                      version = json.loads(path.read_text(encoding="utf-8")).get("version", "")
                  except (OSError, json.JSONDecodeError):
                      continue
                  if re.fullmatch(rf"\d+\.\d+\.\d+-{re.escape(tag)}\.0", str(version)):
                      versions.append(str(version))
              if not versions:
                  return []

              candidates = []
              for pattern in ("package.json", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock", "pnpm-lock.yaml", "CHANGELOG.md"):
                  candidates.extend(path for path in root.rglob(pattern) if "node_modules" not in path.parts)
              changed = []
              for path in sorted(set(candidates)):
                  text = path.read_text(encoding="utf-8")
                  updated = text
                  for version in versions:
                      updated = updated.replace(version, f"{version[:-1]}1")
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")
                      changed.append(str(path))
              return changed


          def build_parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser()
              commands = parser.add_subparsers(dest="command", required=True)
              plan = commands.add_parser("plan")
              plan.add_argument("payload")
              baseline = commands.add_parser("baseline")
              baseline.add_argument("payload")
              validate = commands.add_parser("validate-pr")
              validate.add_argument("payload")
              apply = commands.add_parser("apply")
              apply.add_argument("--version", required=True)
              apply.add_argument("--version-file", required=True)
              apply.add_argument("--changelog", required=True)
              apply.add_argument("--subjects-file", required=True)
              shift = commands.add_parser("shift-prerelease")
              shift.add_argument("--root", required=True)
              shift.add_argument("--tag", required=True)
              return parser


          def main(argv: list[str]) -> int:
              args = build_parser().parse_args(argv)
              if args.command == "plan":
                  result = plan_release(json.loads(Path(args.payload).read_text(encoding="utf-8")))
                  print(json.dumps(result))
                  return 0
              if args.command == "baseline":
                  print(select_baseline(json.loads(Path(args.payload).read_text(encoding="utf-8"))) or "")
                  return 0
              if args.command == "validate-pr":
                  errors = validate_pull_request(json.loads(Path(args.payload).read_text(encoding="utf-8")))
                  if errors:
                      for error in errors:
                          print(f"::error::{error}", file=sys.stderr)
                      return 1
                  print("Release pull request policy passed")
                  return 0
              if args.command == "apply":
                  version_path = Path(args.version_file)
                  version_path.write_text(
                      set_package_version(version_path.read_text(encoding="utf-8"), args.version),
                      encoding="utf-8",
                  )
                  changelog_path = Path(args.changelog)
                  subjects = [
                      line
                      for line in Path(args.subjects_file).read_text(encoding="utf-8").splitlines()
                      if line.strip()
                  ]
                  existing = changelog_path.read_text(encoding="utf-8") if changelog_path.exists() else ""
                  changelog_path.write_text(
                      update_changelog(existing, args.version, subjects) + "\n",
                      encoding="utf-8",
                  )
                  return 0
              changed = shift_initial_prerelease(Path(args.root), args.tag)
              print(json.dumps(changed))
              return 0


          if __name__ == "__main__":
              try:
                  sys.exit(main(sys.argv[1:]))
              except ValueError as exc:
                  print(f"::error::{exc}", file=sys.stderr)
                  sys.exit(1)
END_RELEASE_MODEL


      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory == '.' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working_directory) }}
          registry-url: https://registry.npmjs.org
          scope: ${{ inputs.npm_scope }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Publish packages
        working-directory: ${{ inputs.working_directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          PRERELEASE_BRANCH: ${{ inputs.prerelease_branch }}
          STABLE_COMMAND: ${{ inputs.publish_command }}
          PRERELEASE_COMMAND: ${{ inputs.prerelease_publish_command }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          PYTHONPATH: ${{ runner.temp }}/release-model
        run: |
          set -euo pipefail

          run_publish() {
            local command="$1"
            if [[ -z "$command" ]]; then
              echo "::error::Publish command is empty"
              exit 1
            fi
            bash -euo pipefail -c "$command"
          }

          skip_if_published() {
            python3 - << 'PY'
          import subprocess, sys
          from pathlib import Path
          import release_model
          packages = release_model.public_versions(Path(".").resolve())
          if not packages:
              sys.exit(0)
          for package in packages:
              spec = f"{package['name']}@{package['version']}"
              if subprocess.run(["npm", "view", spec, "version"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode != 0:
                  sys.exit(1)
          sys.exit(0)
          PY
          }

          verify_dist_tag() {
            python3 - << 'PY'
          import json, os, subprocess, time
          from pathlib import Path
          import release_model
          tag = os.environ["PRERELEASE_TAG"] if os.environ["CURRENT_BRANCH"] == os.environ["PRERELEASE_BRANCH"] else "latest"
          for package in release_model.public_versions(Path(".").resolve()):
              seen = None
              for _ in range(3):
                  raw = subprocess.check_output(["npm", "view", package["name"], "dist-tags", "--json"], text=True)
                  seen = json.loads(raw).get(tag)
                  if seen == package["version"]:
                      break
                  time.sleep(2)
              if seen != package["version"]:
                  raise SystemExit(f"{package['name']} {tag} dist-tag is {seen}, expected {package['version']}")
          PY
          }

          if skip_if_published; then
            echo "::notice::All package versions are already on npm. This commit will not publish again."
            exit 0
          fi

          if [[ "$CURRENT_BRANCH" == "$PRERELEASE_BRANCH" ]]; then
            npm config set tag "$PRERELEASE_TAG"
            echo "::notice::Running prerelease publish command: $PRERELEASE_COMMAND"
            python3 -c 'import os, release_model; release_model.assert_library_versions(__import__("pathlib").Path(".").resolve(), prerelease=True, tag=os.environ["PRERELEASE_TAG"])'
            run_publish "$PRERELEASE_COMMAND"
            verify_dist_tag
          elif [[ "$CURRENT_BRANCH" == "$STABLE_BRANCH" ]]; then
            npm config set tag latest
            if [[ -f .changeset/pre.json ]]; then
              echo "::error::Refusing to publish on $STABLE_BRANCH while .changeset/pre.json exists"
              exit 1
            fi
            python3 -c 'import release_model; release_model.assert_library_versions(__import__("pathlib").Path(".").resolve(), prerelease=False, tag="beta")'
            while IFS= read -r -d '' pkg; do
              private=$(jq -r '.private // false' "$pkg")
              ver=$(jq -r '.version // empty' "$pkg")
              [[ "$private" == "true" || -z "$ver" || "$ver" == "null" ]] && continue
              if [[ "$ver" == *-* ]]; then
                echo "::error::$pkg is $ver. Refusing to publish a prerelease as latest."
                exit 1
              fi
            done < <(find . -name node_modules -prune -o -name package.json -print0)
            echo "::notice::Running stable publish command: $STABLE_COMMAND"
            run_publish "$STABLE_COMMAND"
            verify_dist_tag
          else
            echo "::error::Refusing to publish from branch '$CURRENT_BRANCH'"
            exit 1
          fi

      # Keep diagnostics inline: an externally called reusable workflow cannot
      # resolve a local composite action from this workflow's source repository.
      - name: Collect npm diagnostics
        if: ${{ failure() }}
        run: |
          set +e
          ARTIFACT_DIR="${RUNNER_TEMP}/npm-debug"
          NPM_CACHE="$(npm config get cache 2>/dev/null)"
          mkdir -p "$ARTIFACT_DIR"
          {
            echo "Runner OS: ${RUNNER_OS}"
            echo "Node: $(node --version 2>&1)"
            echo "npm: $(npm --version 2>&1)"
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Run ID: ${GITHUB_RUN_ID}"
          } > "${ARTIFACT_DIR}/environment.txt"
          if [[ -d "${NPM_CACHE}/_logs" ]]; then
            cp -R "${NPM_CACHE}/_logs/." "${ARTIFACT_DIR}/" 2>/dev/null || true
          fi

      - name: Upload npm diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-debug/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish outcome
        if: always()
        run: |
          echo "::notice::npm publish job ${{ job.status }} version=${{ needs.version.outputs.version }} branch=${{ github.ref_name }}"
          echo "**npm job:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
