name: Reusable — CI Changesets version / npm

# workflow_call only. Changesets library repos only.
# develop prepares and publishes beta versions. main prepares and publishes stable versions.
# Version changes are committed on a review pull request before npm publication.
# The version commit intentionally omits [skip ci]: merging it is what starts publication.
# Application repos use reusable-ci-tag-release.yml and must not call this workflow.

on:
  workflow_call:
    inputs:
      templates_repository:
        description: >
          Repository that contains this workflow and scripts/release_model.py, as owner/name.
          Required. The job checks that repository out at platform/ using the called workflow ref.
        type: string
        required: true
      node_version:
        description: Node.js version.
        type: string
        required: false
        default: '22'
      working_directory:
        description: Working directory for install / Changesets (repo-relative).
        type: string
        required: false
        default: '.'
      npm_scope:
        description: npm scope for setup-node (e.g. '@web-toolkit'). Empty skips scope.
        type: string
        required: false
        default: ''
      version_command:
        description: Command used by changesets/action to apply versions.
        type: string
        required: false
        default: 'npm run version-packages'
      publish_to_npm:
        description: Publish to the public npm registry after versions are in git.
        type: boolean
        required: false
        default: true
      publish_command:
        description: Command used to publish stable versions.
        type: string
        required: false
        default: 'npm run release'
      prerelease_publish_command:
        description: Command used on prerelease_branch (normally publishes with the prerelease npm dist-tag).
        type: string
        required: false
        default: 'npm run release:beta'
      manage_prerelease_mode:
        description: Automatically enter prerelease mode on prerelease_branch and exit it on stable_branch.
        type: boolean
        required: false
        default: true
      stable_branch:
        description: Branch that publishes stable versions.
        type: string
        required: false
        default: 'main'
      prerelease_branch:
        description: Branch that publishes prerelease versions.
        type: string
        required: false
        default: 'develop'
      prerelease_tag:
        description: Changesets prerelease tag and npm dist-tag.
        type: string
        required: false
        default: 'beta'
      version_file:
        description: package.json relative to working_directory. Informational when a version field exists. Publish readiness does not depend on it.
        type: string
        required: false
        default: 'package.json'
      changeset_title:
        description: Title for the Version Packages pull request.
        type: string
        required: false
        default: 'chore: version packages'
      changeset_commit:
        description: Commit message for version bumps.
        type: string
        required: false
        default: 'chore: version packages'
      use_gh_env:
        description: Bind jobs to a GitHub Environment (reviewers / env secrets).
        type: boolean
        required: false
        default: false
      gh_env:
        description: GitHub Environment name when use_gh_env is true (e.g. stage, prod).
        type: string
        required: false
        default: ''

    secrets:
      NPM_TOKEN:
        required: false
      GH_TOKEN:
        required: true
      TEMPLATES_TOKEN:
        description: Token with read access to the repository that contains this workflow.
        required: true

    outputs:
      version_ready:
        description: '"true" when no pending changesets (versions already in git).'
        value: ${{ jobs.version.outputs.version_ready }}
      version:
        description: Semver from version_file when that file has a version field. Empty for private workspace roots.
        value: ${{ jobs.version.outputs.version }}

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_gh_env && inputs.gh_env || '' }}
    outputs:
      version_ready: ${{ steps.gate.outputs.version_ready }}
      version: ${{ steps.gate.outputs.version }}

    steps:
      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.templates_repository }}
          token: ${{ secrets.TEMPLATES_TOKEN }}
          path: platform
          persist-credentials: false

      - name: Keep platform checkout out of the consumer git tree
        shell: bash
        run: |
          set -euo pipefail
          grep -qxF 'platform/' .git/info/exclude || echo 'platform/' >> .git/info/exclude

      - name: Log run context
        shell: bash
        env:
          LOG_TITLE: Version
          LOG_INPUTS: ${{ toJSON(inputs) }}
          LOG_EXTRA: ''
          LOG_VARIANT: version
        run: bash platform/.github/actions/log-run-context/log-run-context.sh

      - name: Stage release model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-model"
          cp platform/scripts/release_model.py "$RUNNER_TEMP/release-model/release_model.py"

      - name: Stage version command
        shell: bash
        run: bash platform/.github/actions/stage-version-command/stage-version-command.sh

      - name: Remember repository npmrc
        id: npmrc
        run: |
          set -euo pipefail
          if [[ -f .npmrc ]]; then
            cp .npmrc /tmp/repo-npmrc
            echo "existed=true" >> "$GITHUB_OUTPUT"
          else
            echo "existed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory == '.' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working_directory) }}
          registry-url: https://registry.npmjs.org
          scope: ${{ inputs.npm_scope }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Restore repository npmrc
        env:
          NPMRC_EXISTED: ${{ steps.npmrc.outputs.existed }}
        run: |
          set -euo pipefail
          if [[ "$NPMRC_EXISTED" == "true" ]]; then
            cp /tmp/repo-npmrc .npmrc
          else
            rm -f .npmrc
          fi

      - name: Inspect pending changesets
        id: pending
        shell: bash
        env:
          WORK_DIR: ${{ inputs.working_directory }}
        run: bash platform/.github/actions/inspect-pending-changesets/inspect-pending-changesets.sh

      - name: Configure Changesets prerelease mode
        id: pre_mode
        if: ${{ inputs.manage_prerelease_mode }}
        shell: bash
        env:
          WORK_DIR: ${{ inputs.working_directory }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          PRERELEASE_BRANCH: ${{ inputs.prerelease_branch }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          PENDING_COUNT: ${{ steps.pending.outputs.count }}
        run: bash platform/.github/actions/configure-changesets-prerelease/configure-changesets-prerelease.sh

      - name: Open Version Packages pull request for prerelease transition
        if: ${{ steps.pre_mode.outputs.transition == 'exit' && steps.pending.outputs.count == '0' }}
        shell: bash
        env:
          WORK_DIR: ${{ inputs.working_directory }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          VERSION_COMMAND: ${{ inputs.version_command }}
          PR_TITLE: ${{ inputs.changeset_title }}
          PR_COMMIT: ${{ inputs.changeset_commit }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash platform/.github/actions/open-version-packages-pr/open-version-packages-pr.sh

      # v1 matches @changesets/cli v2. Action v2 and later require CLI v3
      # and rename version, commit, title, and createGithubReleases.
      - name: Version Packages pull request
        if: ${{ steps.pending.outputs.count != '0' }}
        uses: changesets/action@v1
        with:
          cwd: ${{ inputs.working_directory }}
          version: bash "$RUNNER_TEMP/version-packages.sh"
          commit: ${{ inputs.changeset_commit }}
          title: ${{ inputs.changeset_title }}
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION_COMMAND: ${{ inputs.version_command }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}

      - name: Decide if version is ready
        id: gate
        shell: bash
        env:
          WORK_DIR: ${{ inputs.working_directory }}
          VERSION_FILE: ${{ inputs.version_file }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          PRERELEASE_BRANCH: ${{ inputs.prerelease_branch }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          MANAGE_PRERELEASE: ${{ inputs.manage_prerelease_mode }}
          PENDING: ${{ steps.pending.outputs.count }}
          PRE_TRANSITION: ${{ steps.pre_mode.outputs.transition || 'none' }}
        run: bash platform/.github/actions/decide-publish-ready/decide-publish-ready.sh

  npm:
    name: Publish npm
    needs: version
    if: ${{ inputs.publish_to_npm && needs.version.outputs.version_ready == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_gh_env && inputs.gh_env || '' }}

    steps:
      - name: Resolve platform checkout
        id: platform_ref
        shell: bash
        env:
          TEMPLATES_REPOSITORY: ${{ inputs.templates_repository }}
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          repo="${GITHUB_WORKFLOW_REF%@*}"
          repo="${repo%%/.github/workflows/*}"
          if [[ -z "$ref" || -z "$repo" || "$repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            echo "::error::Could not parse the platform repository from GITHUB_WORKFLOW_REF."
            exit 1
          fi
          if [[ -n "${TEMPLATES_REPOSITORY:-}" && "$TEMPLATES_REPOSITORY" != "$repo" ]]; then
            echo "::error::templates_repository (${TEMPLATES_REPOSITORY}) is not the repository that contains this workflow (${repo})."
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "repository=$repo"
          } >> "$GITHUB_OUTPUT"

      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "::error::NPM_TOKEN is required when publish_to_npm is true"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.templates_repository }}
          token: ${{ secrets.TEMPLATES_TOKEN }}
          path: platform
          persist-credentials: false

      - name: Keep platform checkout out of the consumer git tree
        shell: bash
        run: |
          set -euo pipefail
          grep -qxF 'platform/' .git/info/exclude || echo 'platform/' >> .git/info/exclude

      - name: Log run context
        shell: bash
        env:
          LOG_TITLE: Publish npm
          LOG_INPUTS: ${{ toJSON(inputs) }}
          LOG_EXTRA: |
            version=${{ needs.version.outputs.version }}
            version_ready=${{ needs.version.outputs.version_ready }}
            branch=${{ github.ref_name }}
            npm_token_present=${{ secrets.NPM_TOKEN != '' }}
          LOG_VARIANT: publish
          PUBLISH_VERSION: ${{ needs.version.outputs.version }}
          PUBLISH_BRANCH: ${{ github.ref_name }}
          STABLE_COMMAND: ${{ inputs.publish_command }}
          PRERELEASE_COMMAND: ${{ inputs.prerelease_publish_command }}
          NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
          JOB_STATUS: ${{ job.status }}
        run: bash platform/.github/actions/log-run-context/log-run-context.sh

      - name: Stage release model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-model"
          cp platform/scripts/release_model.py "$RUNNER_TEMP/release-model/release_model.py"

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory == '.' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working_directory) }}
          registry-url: https://registry.npmjs.org
          scope: ${{ inputs.npm_scope }}

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: npm ci

      - name: Publish packages
        shell: bash
        env:
          WORK_DIR: ${{ inputs.working_directory }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          PRERELEASE_BRANCH: ${{ inputs.prerelease_branch }}
          STABLE_COMMAND: ${{ inputs.publish_command }}
          PRERELEASE_COMMAND: ${{ inputs.prerelease_publish_command }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
        run: bash platform/.github/actions/publish-npm-packages/publish-npm-packages.sh

      - name: Collect npm diagnostics
        if: ${{ failure() }}
        shell: bash
        run: bash platform/.github/actions/upload-npm-logs/collect-diagnostics.sh

      - name: Upload npm diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-debug/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish outcome
        if: always()
        run: |
          echo "::notice::npm publish job ${{ job.status }} version=${{ needs.version.outputs.version }} branch=${{ github.ref_name }}"
          echo "**npm job:** ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
