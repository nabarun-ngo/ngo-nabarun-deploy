name: Reusable — CI tag and GitHub Release

# workflow_call only. App repos that are not on Changesets.
# Creates a bare semver tag (no v prefix), then a GitHub Release.
# version input set: tag exactly that version when the ref is the stable or prerelease branch.
# version input empty: compute from version_file —
#   stage: next patch as a prerelease (2.3.2 → 2.3.3-beta.1, then 2.3.3-beta.2).
#   main: tag the stable version already in version_file (2.3.3). A prerelease version on main fails.
# A tag that already exists on another commit fails the job. Does not deploy or publish to npm.

on:
  workflow_call:
    inputs:
      version:
        description: Explicit version to tag (v prefix optional). Empty computes the version from version_file.
        type: string
        required: false
        default: ''
      version_file:
        description: Repo-relative package.json whose version field is the release base when version is empty.
        type: string
        required: false
        default: 'package.json'
      stable_branch:
        description: Branch that gets a stable X.Y.Z tag.
        type: string
        required: false
        default: 'main'
      prerelease_branch:
        description: Branch that gets the next X.Y.Z-<tag>.N tag.
        type: string
        required: false
        default: 'stage'
      prerelease_tag:
        description: Prerelease identifier (alpha, beta, or rc). Must match deploy tag resolution.
        type: string
        required: false
        default: 'beta'
      use_gh_env:
        description: Bind the job to a GitHub Environment (reviewers / env secrets).
        type: boolean
        required: false
        default: false
      gh_env:
        description: GitHub Environment name when use_gh_env is true (e.g. stage, prod).
        type: string
        required: false
        default: ''

    secrets:
      GH_TOKEN:
        required: true

    outputs:
      tag:
        description: Tag created or already present on this commit.
        value: ${{ jobs.tag_release.outputs.tag }}
      created:
        description: '"true" when this run pushed a new git tag.'
        value: ${{ jobs.tag_release.outputs.created }}
      prerelease:
        description: '"true" when the tag is a prerelease.'
        value: ${{ jobs.tag_release.outputs.prerelease }}

concurrency:
  group: tag-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag_release:
    name: Tag and GitHub Release
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_gh_env && inputs.gh_env || '' }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      created: ${{ steps.release.outputs.created }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Log run context
        env:
          LOG_TITLE: Tag and GitHub Release
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          echo "::notice::${LOG_TITLE} — ${GITHUB_EVENT_NAME} ${GITHUB_REF} sha=${GITHUB_SHA:0:7} run=${GITHUB_RUN_ID}"
          echo "::group::${LOG_TITLE} context"
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA}"
          echo "actor=${GITHUB_ACTOR} run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
          echo "job=${GITHUB_JOB} workflow=${GITHUB_WORKFLOW} repository=${GITHUB_REPOSITORY}"
          echo "--- inputs ---"
          echo "${LOG_INPUTS}"
          echo "::endgroup::"
          {
            echo "### ${LOG_TITLE}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Event | \`${GITHUB_EVENT_NAME}\` |"
            echo "| Ref | \`${GITHUB_REF}\` |"
            echo "| SHA | \`${GITHUB_SHA}\` |"
            echo "| Run | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
            echo ""
            echo "<details><summary>inputs</summary>"
            echo ""
            echo '```json'
            echo "${LOG_INPUTS}"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Create git tag and GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          VERSION_FILE: ${{ inputs.version_file }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          STABLE_BRANCH: ${{ inputs.stable_branch }}
          PRERELEASE_BRANCH: ${{ inputs.prerelease_branch }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          if [[ "$PRERELEASE_TAG" != "alpha" && "$PRERELEASE_TAG" != "beta" && "$PRERELEASE_TAG" != "rc" ]]; then
            echo "::error::prerelease_tag must be alpha, beta, or rc (deploy resolves only those)."
            exit 1
          fi
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          PRERELEASE_RE='^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'
          VERSION_SOURCE="input"
          VERSION="${INPUT_VERSION#v}"

          if [[ -z "$VERSION" ]]; then
            VERSION_SOURCE="$VERSION_FILE"
            if [[ ! -f "$VERSION_FILE" ]]; then
              echo "::error::version_file not found: $VERSION_FILE"
              exit 1
            fi
            VERSION=$(jq -r '.version // empty' "$VERSION_FILE")
          fi

          if [[ ! "$VERSION" =~ $SEMVER_RE && ! "$VERSION" =~ $PRERELEASE_RE ]]; then
            echo "::error::Unsupported version '$VERSION' from $VERSION_SOURCE. Expected X.Y.Z or X.Y.Z-(alpha|beta|rc).N."
            exit 1
          fi

          if [[ "$CURRENT_BRANCH" != "$STABLE_BRANCH" && "$CURRENT_BRANCH" != "$PRERELEASE_BRANCH" ]]; then
            echo "::error::Branch '$CURRENT_BRANCH' is neither $STABLE_BRANCH nor $PRERELEASE_BRANCH."
            exit 1
          fi

          tag_exists() {
            git ls-remote --tags origin "refs/tags/${1}" | grep -q .
          }

          next_prerelease() {
            local base="$1"
            local base_re="${base//./\\.}"
            local max=0
            local found=0
            local name n
            while read -r name; do
              [[ -z "$name" ]] && continue
              if [[ "$name" =~ ^${base_re}-${PRERELEASE_TAG}\.([0-9]+)$ ]]; then
                found=1
                n=$((10#${BASH_REMATCH[1]}))
                if (( n > max )); then
                  max=$n
                fi
              fi
            done < <(git ls-remote --tags origin "refs/tags/${base}-${PRERELEASE_TAG}.*" \
              | awk '{print $2}' | sed -e 's#refs/tags/##' -e 's/\^{}$//' | sort -u)
            if (( found == 1 )); then
              echo "${base}-${PRERELEASE_TAG}.$((max + 1))"
            else
              echo "${base}-${PRERELEASE_TAG}.1"
            fi
          }

          CREATED=false
          IS_PRERELEASE=false
          TAG=""

          if [[ -n "$INPUT_VERSION" ]]; then
            TAG="$VERSION"
            echo "::notice::Using provided version $TAG"
          elif [[ "$CURRENT_BRANCH" == "$PRERELEASE_BRANCH" ]]; then
            IS_PRERELEASE=true
            if ! HEAD_TAGS=$(git tag --points-at HEAD); then
              echo "::error::Could not list tags on this commit."
              exit 1
            fi
            HEAD_TAG=$(printf '%s\n' "$HEAD_TAGS" | grep -E "^[0-9]+\.[0-9]+\.[0-9]+-${PRERELEASE_TAG}\.[0-9]+$" | sort -V | tail -1 || true)
            if [[ -n "$HEAD_TAG" ]]; then
              TAG="$HEAD_TAG"
              echo "::notice::Commit already tagged $TAG; skipping a new prerelease tag."
            elif [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-${PRERELEASE_TAG}\.[0-9]+$ ]]; then
              BASE="${BASH_REMATCH[1]}"
              if tag_exists "$VERSION"; then
                TAG=$(next_prerelease "$BASE")
              else
                TAG="$VERSION"
              fi
            elif [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              BASE="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
              TAG=$(next_prerelease "$BASE")
            else
              echo "::error::On $PRERELEASE_BRANCH, version must be X.Y.Z or X.Y.Z-${PRERELEASE_TAG}.N. Found '$VERSION'."
              exit 1
            fi
          elif [[ "$CURRENT_BRANCH" == "$STABLE_BRANCH" ]]; then
            if [[ "$VERSION" == *-* ]]; then
              echo "::error::Refusing to tag prerelease version '$VERSION' on $STABLE_BRANCH. Set a stable X.Y.Z in $VERSION_FILE."
              exit 1
            fi
            if ! HEAD_TAGS=$(git tag --points-at HEAD); then
              echo "::error::Could not list tags on this commit."
              exit 1
            fi
            HEAD_TAG=$(printf '%s\n' "$HEAD_TAGS" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [[ -n "$HEAD_TAG" ]]; then
              TAG="$HEAD_TAG"
              echo "::notice::Commit already tagged $TAG; skipping a new stable tag."
            elif tag_exists "$VERSION"; then
              echo "::error::Tag $VERSION already exists on another commit. Bump $VERSION_FILE before the next $STABLE_BRANCH release."
              exit 1
            else
              TAG="$VERSION"
            fi
          else
            echo "::error::Could not choose a tag for $CURRENT_BRANCH from version '$VERSION'."
            exit 1
          fi

          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          HEAD_COMMIT=$(git rev-parse HEAD)
          TAG_COMMIT=""
          if git rev-parse -q --verify "refs/tags/${TAG}^{}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "refs/tags/${TAG}^{}")
          fi

          if [[ -n "$TAG_COMMIT" && "$TAG_COMMIT" == "$HEAD_COMMIT" ]]; then
            echo "::notice::Tag $TAG already points at this commit."
          elif tag_exists "$TAG"; then
            echo "::error::Tag $TAG already exists on another commit."
            exit 1
          else
            git tag -a "$TAG" -m "chore(release): $TAG"
            git push origin "refs/tags/${TAG}"
            CREATED=true
            echo "::notice::Pushed git tag $TAG"
          fi

          PRERELEASE_FLAG=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $TAG already exists."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${PRERELEASE_FLAG[@]}" \
              --repo "$GH_REPO"
            echo "::notice::Created GitHub Release $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "### Tag and GitHub Release"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Tag | \`$TAG\` |"
            echo "| Created this run | \`$CREATED\` |"
            echo "| Prerelease | \`$IS_PRERELEASE\` |"
            echo "| Version | \`$VERSION\` from \`$VERSION_SOURCE\` |"
          } >> "$GITHUB_STEP_SUMMARY"
