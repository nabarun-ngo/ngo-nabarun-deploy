name: Reusable — Deploy GAE Node.js

on:
  workflow_call:
    inputs:
      # ── Manifest-resolved fields ──────────────────────────────────────────
      app_name:
        type: string
        required: true
      repository:
        type: string
        required: true
      build_root:
        type: string
        required: false
        default: '.'
      app_root:
        description: >
          Path to the app directory inside the source repo (relative to repo root).
          When set, artifact is staged from <app_root>/<output_path>.
          When omitted, staged from <build_root>/<output_path>.
        type: string
        required: false
        default: ''
      node_version:
        type: string
        required: false
        default: '20'
      install_command:
        type: string
        required: false
        default: 'npm ci'
      build_command:
        type: string
        required: true
      output_path:
        type: string
        required: false
        default: 'dist'
      bundle_includes:
        type: string
        required: false
        default: ''
      config_template:
        type: string
        required: true
      gae_service:
        type: string
        required: true
      gae_instance_class:
        description: App Engine instance class (e.g. F1, F2, B2). Defaults to F2.
        type: string
        required: false
        default: 'F2'
      gae_min_instances:
        description: Minimum number of idle instances for automatic scaling. Defaults to 0.
        type: string
        required: false
        default: '0'
      gae_max_instances:
        description: Maximum number of instances for automatic scaling. Defaults to 10.
        type: string
        required: false
        default: '1'
      db_migrate:
        type: boolean
        required: false
        default: false
      db_command:
        type: string
        required: false
        default: ''
      health_check_enabled:
        description: >
          Run the mandatory health check between the no-promote deploy and the
          traffic promotion. Defaults to true so a manifest without a
          healthCheck block cannot promote an unverified version.
        type: boolean
        required: false
        default: true
      health_check_path:
        type: string
        required: false
        default: '/health'
      health_check_url:
        type: string
        required: false
        default: ''
      doppler_bundle_cli:
        type: boolean
        required: false
        default: false
      doppler_project:
        type: string
        required: false
        default: ''
      doppler_config:
        description: >
          Doppler config name for this environment (e.g. stg, prd).
          Resolved from environments[target].secrets.config in the manifest.
          Falls back to target_environment when not provided.
        type: string
        required: false
        default: ''
      # ── Runtime fields ────────────────────────────────────────────────────
      ref:
        description: Git ref (tag or branch) to deploy.
        type: string
        required: true
      use_gh_env:
        description: Bind migrate/deploy jobs to a GitHub Environment (reviewers / env secrets).
        type: boolean
        required: false
        default: true
      gh_env:
        description: GitHub Environment name when use_gh_env is true (e.g. stage, prod).
        type: string
        required: false
        default: ''
      target_environment:
        description: Logical environment label (stage | prod) — used for render-config vars.
        type: string
        required: true

    secrets:
      PAT:
        required: true
      GCP_PROJECT_ID:
        required: true
      GCP_SA_KEY:
        required: true
      DOPPLER_TOKEN:
        required: false

    outputs:
      deploy_url:
        description: Deployed App Engine service URL.
        value: ${{ jobs.deploy.outputs.deploy_url }}

permissions:
  contents: read
  id-token: write

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Build
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build — ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.set_artifact.outputs.artifact_name }}

    steps:
      - name: Log run context
        env:
          LOG_TITLE: GAE build — ${{ inputs.app_name }}
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          echo "::notice::${LOG_TITLE} — ref=${{ inputs.ref }} run=${GITHUB_RUN_ID}"
          echo "::group::${LOG_TITLE} context"
          echo "event=${GITHUB_EVENT_NAME} sha=${GITHUB_SHA}"
          echo "job=${GITHUB_JOB} actor=${GITHUB_ACTOR}"
          echo "${LOG_INPUTS}"
          echo "::endgroup::"

      - name: Resolve platform checkout
        id: platform_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          repo="${GITHUB_WORKFLOW_REF%@*}"
          repo="${repo%%/.github/workflows/*}"
          if [[ -z "$ref" || -z "$repo" || "$repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            echo "::error::Could not parse the platform repository from GITHUB_WORKFLOW_REF."
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "repository=$repo"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.platform_ref.outputs.repository }}
          ref: ${{ steps.platform_ref.outputs.ref }}
          token: ${{ github.token }}
          path: platform
          persist-credentials: false

      - name: Checkout application source
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PAT }}
          path: app-source

      - name: Set artifact name
        id: set_artifact
        run: |
          echo "artifact_name=gae-bundle-${{ inputs.app_name }}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          echo "::notice::artifact_name=gae-bundle-${{ inputs.app_name }}-${{ github.run_id }}"

      - name: Set up Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.build_root == '.' && 'app-source/package-lock.json' || format('app-source/{0}/package-lock.json', inputs.build_root) }}

      - name: Install dependencies
        working-directory: app-source/${{ inputs.build_root }}
        run: ${{ inputs.install_command }}

      - name: Build application
        working-directory: app-source/${{ inputs.build_root }}
        run: ${{ inputs.build_command }}

      - name: Stage deploy bundle
        id: stage
        shell: bash
        env:
          BUILD_ROOT: app-source/${{ inputs.build_root }}
          APP_ROOT: ${{ inputs.app_root != '' && format('app-source/{0}', inputs.app_root) || '' }}
          OUTPUT_PATH: ${{ inputs.output_path }}
          BUNDLE_INCLUDES: ${{ inputs.bundle_includes }}
          ARTIFACT_NAME: ${{ steps.set_artifact.outputs.artifact_name }}
        run: bash platform/.github/actions/stage-node-artifact/stage-bundle.sh

      - name: Download and embed Doppler CLI
        if: ${{ inputs.doppler_bundle_cli == true }}
        shell: bash
        env:
          BUNDLE_DIR: ${{ steps.stage.outputs.bundle_dir }}
        run: |
          set -euo pipefail

          mkdir -p "$BUNDLE_DIR/bin"

          DOPPLER_VERSION=$(curl -sf "https://api.github.com/repos/DopplerHQ/cli/releases/latest" \
            | jq -r '.tag_name' | sed 's/^v//')

          echo "Downloading Doppler CLI v${DOPPLER_VERSION}..."
          curl -fsSL "https://github.com/DopplerHQ/cli/releases/download/${DOPPLER_VERSION}/doppler_${DOPPLER_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/doppler.tar.gz

          tar -xzf /tmp/doppler.tar.gz -C /tmp doppler
          mv /tmp/doppler "$BUNDLE_DIR/bin/doppler"
          chmod +x "$BUNDLE_DIR/bin/doppler"

          echo "::notice::Doppler CLI v${DOPPLER_VERSION} embedded at bin/doppler"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.set_artifact.outputs.artifact_name }}
          path: deploy-bundle
          retention-days: 1
          if-no-files-found: error

      - name: Build outcome
        if: always()
        run: |
          echo "::notice::GAE build ${{ job.status }} app=${{ inputs.app_name }} artifact=gae-bundle-${{ inputs.app_name }}-${{ github.run_id }}"
          {
            echo "### GAE Build — ${{ inputs.app_name }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Status | ${{ job.status }} |"
            echo "| Ref | \`${{ inputs.ref }}\` |"
            echo "| Artifact | \`gae-bundle-${{ inputs.app_name }}-${{ github.run_id }}\` |"
            echo "| build_root | \`${{ inputs.build_root }}\` |"
            echo "| app_root | \`${{ inputs.app_root }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Migrate (conditional — must complete before deploy)
  # ──────────────────────────────────────────────────────────────────────────
  migrate:
    name: Database migrate — ${{ inputs.app_name }}
    needs: build
    if: ${{ inputs.db_migrate == true }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.use_gh_env && inputs.gh_env || '' }}

    steps:
      - name: Log run context
        run: |
          echo "::notice::GAE migrate — ${{ inputs.app_name }} artifact=${{ needs.build.outputs.artifact_name }} cmd=${{ inputs.db_command }}"
          echo "::group::GAE migrate context"
          echo "gh_env=${{ inputs.gh_env }} use_gh_env=${{ inputs.use_gh_env }}"
          echo "doppler_project=${{ inputs.doppler_project }}"
          echo "doppler_config=${{ inputs.doppler_config }}"
          echo "target_environment=${{ inputs.target_environment }}"
          echo "::endgroup::"

      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Resolve platform checkout
        id: platform_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          repo="${GITHUB_WORKFLOW_REF%@*}"
          repo="${repo%%/.github/workflows/*}"
          if [[ -z "$ref" || -z "$repo" || "$repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            echo "::error::Could not parse the platform repository from GITHUB_WORKFLOW_REF."
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "repository=$repo"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.platform_ref.outputs.repository }}
          ref: ${{ steps.platform_ref.outputs.ref }}
          token: ${{ github.token }}
          path: platform
          persist-credentials: false

      - name: Download deploy bundle
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: deploy-bundle

      - name: Setup Node.js ${{ inputs.node_version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Run database migration
        shell: bash
        env:
          WORK_DIR: deploy-bundle
          DB_COMMAND: ${{ inputs.db_command }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: ${{ inputs.doppler_project }}
          DOPPLER_CONFIG: ${{ inputs.doppler_config != '' && inputs.doppler_config || inputs.target_environment }}
        run: bash platform/.github/actions/run-database-migration/run-database-migration.sh

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### Database Migration"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Command | \`${{ inputs.db_command }}\` |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Deploy — no-promote → health check → promote traffic
  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy GAE — ${{ inputs.app_name }}
    needs: [build, migrate]
    # Run if build succeeded AND either migration was skipped or it succeeded
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.use_gh_env && inputs.gh_env || '' }}
      url: ${{ steps.promote.outputs.deploy_url }}
    outputs:
      deploy_url: ${{ steps.promote.outputs.deploy_url }}
      new_version: ${{ steps.deploy_version.outputs.version_id }}

    steps:
      - name: Log run context
        env:
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          echo "::notice::GAE deploy — ${{ inputs.app_name }} ref=${{ inputs.ref }} gh_env=${{ inputs.gh_env }} migrate=${{ needs.migrate.result }}"
          echo "::group::GAE deploy context"
          echo "artifact=${{ needs.build.outputs.artifact_name }}"
          echo "build=${{ needs.build.result }} migrate=${{ needs.migrate.result }}"
          echo "${LOG_INPUTS}"
          echo "::endgroup::"

      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Resolve platform checkout
        id: platform_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          repo="${GITHUB_WORKFLOW_REF%@*}"
          repo="${repo%%/.github/workflows/*}"
          if [[ -z "$ref" || -z "$repo" || "$repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            echo "::error::Could not parse the platform repository from GITHUB_WORKFLOW_REF."
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "repository=$repo"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.platform_ref.outputs.repository }}
          ref: ${{ steps.platform_ref.outputs.ref }}
          token: ${{ github.token }}
          path: platform
          persist-credentials: false

      - name: Download deploy bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: deploy-bundle

      - name: Render app.yaml from template
        shell: bash
        env:
          TEMPLATE_PATH: platform/${{ inputs.config_template }}
          OUTPUT_PATH: deploy-bundle/app.yaml
          EXTRA_VARS: |
            GAE_SERVICE=${{ inputs.gae_service }}
            GAE_INSTANCE_CLASS=${{ inputs.gae_instance_class }}
            GAE_MIN_INSTANCES=${{ inputs.gae_min_instances }}
            GAE_MAX_INSTANCES=${{ inputs.gae_max_instances }}
            DEPLOY_ENV=${{ inputs.target_environment }}
            DOPPLER_PROJECT=${{ inputs.doppler_project }}
            DOPPLER_CONFIG=${{ inputs.doppler_config }}
          STRICT: 'false'
        run: bash platform/.github/actions/render-config/render-template.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Inject DOPPLER_TOKEN into app.yaml
        if: ${{ inputs.doppler_bundle_cli == true }}
        shell: bash
        env:
          WORK_DIR: deploy-bundle
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: bash platform/.github/actions/inject-doppler-token/inject-doppler-token.sh

      - name: Deploy to GAE (no-promote)
        id: deploy_version
        shell: bash
        env:
          WORK_DIR: deploy-bundle
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GAE_SERVICE: ${{ inputs.gae_service }}
        run: bash platform/.github/actions/deploy-gae-version/deploy-gae-version.sh

      - name: Health check new version
        if: ${{ inputs.health_check_enabled == true }}
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERSION_ID: ${{ steps.deploy_version.outputs.version_id }}
          GAE_SERVICE: ${{ inputs.gae_service }}
          HC_PATH: ${{ inputs.health_check_path }}
          HC_URL_OVERRIDE: ${{ inputs.health_check_url }}
          HC_TIMEOUT: '120'
        run: bash platform/.github/actions/health-check-gae-version/health-check-gae-version.sh

      - name: Promote traffic to new version
        id: promote
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          VERSION_ID: ${{ steps.deploy_version.outputs.version_id }}
          GAE_SERVICE: ${{ inputs.gae_service }}
        run: bash platform/.github/actions/promote-gae-traffic/promote-gae-traffic.sh

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### GAE Deploy — ${{ inputs.app_name }}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| App | \`${{ inputs.app_name }}\` |"
            echo "| Service | \`${{ inputs.gae_service }}\` |"
            echo "| Version | \`${{ steps.deploy_version.outputs.version_id }}\` |"
            echo "| Source ref | \`${{ inputs.ref }}\` |"
            echo "| Environment | \`${{ inputs.gh_env }}\` |"
            echo "| Deploy URL | ${{ steps.promote.outputs.deploy_url }} |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
