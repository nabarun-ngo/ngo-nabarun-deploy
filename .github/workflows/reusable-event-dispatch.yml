name: Reusable — Event dispatch

# workflow_call only. Application repos call this after reusable-ci-tag-release
# reports created=true. It publishes one release fact to the platform repository
# and nothing else. Nothing in this repository deploys because of that event.
# Operators run ops-deploy-backend.yml or ops-deploy-frontend.yml.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Bare semver tag that was created (no v prefix).
        type: string
        required: true
      prerelease:
        description: Whether tag_name is a prerelease. Must agree with the tag.
        type: boolean
        required: true
      platform_repository:
        description: Platform repository that consumes the event (org/repo).
        type: string
        required: false
        default: 'nabarun-ngo/deploy-platform'
      event_type:
        description: repository_dispatch event type to publish.
        type: string
        required: false
        default: 'Release-Created'
      source_repository:
        description: Application repository the release belongs to. Empty uses the calling repository.
        type: string
        required: false
        default: ''
      source_ref:
        description: Branch the release was created from. Empty uses the calling ref name.
        type: string
        required: false
        default: ''

    secrets:
      DISPATCH_TOKEN:
        description: >
          Token that can read the repository containing this workflow and create
          repository dispatches on platform_repository. The caller GITHUB_TOKEN cannot do this.
        required: true

    outputs:
      published:
        description: '"true" when the event was accepted by the platform repository.'
        value: ${{ jobs.publish.outputs.published }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.event_type }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.dispatch.outputs.published }}

    steps:
      - name: Log run context
        env:
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          echo "::notice::Publish release event — ${GITHUB_REPOSITORY} ref=${GITHUB_REF_NAME} run=${GITHUB_RUN_ID}"
          echo "::group::Publish release event context"
          echo "event=${GITHUB_EVENT_NAME} sha=${GITHUB_SHA} actor=${GITHUB_ACTOR}"
          echo "${LOG_INPUTS}"
          echo "::endgroup::"

      - name: Resolve platform checkout
        id: platform_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          repo="${GITHUB_WORKFLOW_REF%@*}"
          repo="${repo%%/.github/workflows/*}"
          if [[ -z "$ref" || -z "$repo" || "$repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            echo "::error::Could not parse the platform repository from GITHUB_WORKFLOW_REF."
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "repository=$repo"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.platform_ref.outputs.repository }}
          ref: ${{ steps.platform_ref.outputs.ref }}
          token: ${{ secrets.DISPATCH_TOKEN }}
          path: platform
          persist-credentials: false

      - name: Publish release fact
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          PLATFORM_REPOSITORY: ${{ inputs.platform_repository }}
          EVENT_TYPE: ${{ inputs.event_type }}
          TAG_NAME: ${{ inputs.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: bash platform/.github/actions/publish-release-event/publish-release-event.sh

      - name: Write step summary
        if: always()
        run: |
          {
            echo "### Release event"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Event | \`${{ inputs.event_type }}\` |"
            echo "| Consumer | \`${{ inputs.platform_repository }}\` |"
            echo "| Repository | \`${{ inputs.source_repository != '' && inputs.source_repository || github.repository }}\` |"
            echo "| Tag | \`${{ inputs.tag_name }}\` |"
            echo "| Prerelease | \`${{ inputs.prerelease }}\` |"
            echo "| Status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
