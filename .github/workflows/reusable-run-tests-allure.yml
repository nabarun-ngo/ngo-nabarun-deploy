name: Reusable — Run Tests (Allure)

on:
  workflow_call:
    inputs:
      test_repository:
        description: GitHub repository containing Cucumber/Maven tests (org/repo).
        type: string
        required: true
      test_branch:
        description: Branch to checkout in the test repository.
        type: string
        required: false
        default: main
      test_tags:
        description: Cucumber tag expression (e.g. '@smoke', '@regression and not @wip').
        type: string
        required: true
      target_environment:
        description: Logical environment under test (stage | prod).
        type: string
        required: false
        default: stage
      use_gh_env:
        description: Bind execute jobs to a GitHub Environment (reviewers / env secrets).
        type: boolean
        required: false
        default: true
      gh_env:
        description: GitHub Environment name when use_gh_env is true (e.g. stage, tests-scheduled).
        type: string
        required: false
        default: ''
      doppler_project:
        description: Doppler project name for test secrets (empty = no Doppler).
        type: string
        required: false
        default: ''
      doppler_config:
        description: Doppler config name for this environment (stg | prd).
        type: string
        required: false
        default: ''
      parallelism:
        description: Number of parallel test execution shards.
        type: number
        required: false
        default: 3
      timeout_minutes:
        description: Maximum minutes for each shard.
        type: number
        required: false
        default: 60
      runner_os:
        description: Runner image to use for test execution.
        type: string
        required: false
        default: ubuntu-latest
      report_title:
        description: Title shown in the Allure report.
        type: string
        required: false
        default: Test Report

    secrets:
      PAT:
        required: true
      DOPPLER_TOKEN:
        description: >
          Doppler token for the bound GitHub Environment. The execute job's
          environment: binding exposes this automatically; the caller does
          not pass it explicitly (same pattern as reusable-deploy-gae-node
          and reusable-deploy-firebase-node).
        required: false

    outputs:
      report_url:
        description: URL to the published Allure report.
        value: ${{ jobs.report.outputs.report_url }}
      total_tests:
        description: Total test cases executed.
        value: ${{ jobs.report.outputs.total_tests }}
      passed_tests:
        description: Passed test cases.
        value: ${{ jobs.report.outputs.passed_tests }}
      failed_tests:
        description: Failed test cases.
        value: ${{ jobs.report.outputs.failed_tests }}
      broken_tests:
        description: Broken test cases.
        value: ${{ jobs.report.outputs.broken_tests }}
      tests_passed:
        description: '"true" if the gate job succeeded.'
        value: ${{ jobs.gate.outputs.tests_passed }}

permissions:
  contents: write

jobs:
  discover:
    name: Discover test features
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
      feature_count: ${{ steps.build_matrix.outputs.feature_count }}
      total_shards: ${{ steps.build_matrix.outputs.total_shards }}

    steps:
      - name: Log run context
        env:
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          echo "::notice::Discover tests — repo=${{ inputs.test_repository }} tags=${{ inputs.test_tags }} env=${{ inputs.target_environment }}"
          echo "::group::Discover context"
          echo "${LOG_INPUTS}"
          echo "::endgroup::"

      - name: Require test repository
        env:
          TEST_REPOSITORY: ${{ inputs.test_repository }}
        run: |
          if [[ -z "$TEST_REPOSITORY" ]]; then
            echo "::error::test_repository is empty. Set repository variable TEST_REPOSITORY (org/repo)."
            exit 1
          fi

      - name: Resolve platform checkout
        id: platform_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          repo="${GITHUB_WORKFLOW_REF%@*}"
          repo="${repo%%/.github/workflows/*}"
          if [[ -z "$ref" || -z "$repo" || "$repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            echo "::error::Could not parse the platform repository from GITHUB_WORKFLOW_REF."
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "repository=$repo"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.platform_ref.outputs.repository }}
          ref: ${{ steps.platform_ref.outputs.ref }}
          token: ${{ github.token }}
          path: platform
          persist-credentials: false

      - name: Checkout test repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.test_repository }}
          ref: ${{ inputs.test_branch }}
          token: ${{ secrets.PAT }}
          path: test-source

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: test-source/pom.xml

      - name: Discover feature files
        id: build_matrix
        shell: bash
        env:
          WORK_DIR: test-source
          PARALLELISM: ${{ inputs.parallelism }}
        run: bash platform/.github/actions/discover-test-features/discover-test-features.sh

  execute:
    name: Test shard ${{ matrix.shard }}/${{ needs.discover.outputs.total_shards }}
    needs: discover
    runs-on: ${{ inputs.runner_os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment:
      name: ${{ inputs.use_gh_env && inputs.gh_env || '' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Log run context
        env:
          LOG_MATRIX: ${{ toJSON(matrix) }}
        run: |
          echo "::notice::Test shard ${{ matrix.shard }} tags=${{ inputs.test_tags }} env=${{ inputs.target_environment }} gh_env=${{ inputs.gh_env }}"
          echo "::group::Shard context"
          echo "test_repository=${{ inputs.test_repository }}"
          echo "doppler_project=${{ inputs.doppler_project }}"
          echo "timeout_minutes=${{ inputs.timeout_minutes }}"
          echo "${LOG_MATRIX}"
          echo "::endgroup::"

      - name: Require gh_env
        if: ${{ inputs.use_gh_env }}
        env:
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$GH_ENV" ]]; then
            echo "::error::gh_env is required when use_gh_env is true"
            exit 1
          fi

      - name: Resolve platform checkout
        id: platform_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          repo="${GITHUB_WORKFLOW_REF%@*}"
          repo="${repo%%/.github/workflows/*}"
          if [[ -z "$ref" || -z "$repo" || "$repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            echo "::error::Could not parse the platform repository from GITHUB_WORKFLOW_REF."
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "repository=$repo"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.platform_ref.outputs.repository }}
          ref: ${{ steps.platform_ref.outputs.ref }}
          token: ${{ github.token }}
          path: platform
          persist-credentials: false

      - name: Checkout test repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.test_repository }}
          ref: ${{ inputs.test_branch }}
          token: ${{ secrets.PAT }}
          path: test-source

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          cache-dependency-path: test-source/pom.xml

      - name: Install Doppler CLI
        if: ${{ inputs.doppler_project != '' }}
        uses: dopplerhq/cli-action@v4

      - name: Require Doppler token
        if: ${{ inputs.doppler_project != '' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GH_ENV: ${{ inputs.gh_env }}
        run: |
          if [[ -z "$DOPPLER_TOKEN" ]]; then
            echo "::error::DOPPLER_TOKEN is empty for GitHub Environment '${GH_ENV}'. Add it as an environment secret."
            exit 1
          fi

      - name: Run Cucumber tests (with Doppler)
        id: mvn_doppler
        if: ${{ inputs.doppler_project != '' }}
        continue-on-error: true
        shell: bash
        env:
          WORK_DIR: test-source
          USE_DOPPLER: 'true'
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: ${{ inputs.doppler_project }}
          DOPPLER_CONFIG: ${{ inputs.doppler_config }}
          TEST_TAGS: ${{ inputs.test_tags }}
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ needs.discover.outputs.total_shards }}
          TARGET_ENV: ${{ inputs.target_environment }}
        run: bash platform/.github/actions/run-cucumber-shard/run-cucumber-shard.sh

      - name: Run Cucumber tests (without Doppler)
        id: mvn_plain
        if: ${{ inputs.doppler_project == '' }}
        continue-on-error: true
        shell: bash
        env:
          WORK_DIR: test-source
          USE_DOPPLER: 'false'
          TEST_TAGS: ${{ inputs.test_tags }}
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ needs.discover.outputs.total_shards }}
          TARGET_ENV: ${{ inputs.target_environment }}
        run: bash platform/.github/actions/run-cucumber-shard/run-cucumber-shard.sh

      - name: Record Maven outcome
        env:
          DOPPLER_OUTCOME: ${{ steps.mvn_doppler.outcome }}
          PLAIN_OUTCOME: ${{ steps.mvn_plain.outcome }}
          USE_DOPPLER: ${{ inputs.doppler_project != '' }}
        run: |
          if [[ "$USE_DOPPLER" == "true" && "$DOPPLER_OUTCOME" == "failure" ]]; then
            echo "::warning::Maven (Doppler) failed on shard ${{ matrix.shard }} — results still uploaded"
          fi
          if [[ "$USE_DOPPLER" != "true" && "$PLAIN_OUTCOME" == "failure" ]]; then
            echo "::warning::Maven failed on shard ${{ matrix.shard }} — results still uploaded"
          fi

      - name: Upload Allure results shard
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-shard-${{ matrix.shard }}
          path: test-source/allure-results/
          retention-days: 1
          if-no-files-found: error

  report:
    name: Publish Allure report
    needs: [discover, execute]
    if: ${{ always() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    outputs:
      report_url: ${{ steps.publish.outputs.report_url }}
      total_tests: ${{ steps.summary.outputs.total_tests }}
      passed_tests: ${{ steps.summary.outputs.passed_tests }}
      failed_tests: ${{ steps.summary.outputs.failed_tests }}
      broken_tests: ${{ steps.summary.outputs.broken_tests }}

    steps:
      - name: Log run context
        run: |
          echo "::notice::Publish Allure — execute=${{ needs.execute.result }} title=${{ inputs.report_title }}"

      - name: Resolve platform checkout
        id: platform_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          repo="${GITHUB_WORKFLOW_REF%@*}"
          repo="${repo%%/.github/workflows/*}"
          if [[ -z "$ref" || -z "$repo" || "$repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            echo "::error::Could not parse the platform repository from GITHUB_WORKFLOW_REF."
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "repository=$repo"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.platform_ref.outputs.repository }}
          ref: ${{ steps.platform_ref.outputs.ref }}
          token: ${{ github.token }}
          path: platform
          persist-credentials: false

      - name: Download all Allure result shards
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-shard-*
          path: allure-results-raw/
          merge-multiple: true
          if-no-files-found: error

      - name: Clone gh-pages and restore Allure history
        shell: bash
        env:
          GH_PAGES_BRANCH: gh-pages
          REPORT_BASE_PATH: allure-report
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bash platform/.github/actions/publish-allure/restore-history.sh

      - name: Merge result shards
        shell: bash
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash platform/.github/actions/publish-allure/merge-shards.sh

      - name: Install Allure CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v allure &>/dev/null; then
            echo "Installing Allure CLI into \$HOME..."
            curl -fsSL https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz \
              -o /tmp/allure.tgz
            mkdir -p "$HOME/allure"
            tar -xzf /tmp/allure.tgz -C "$HOME/allure"
            echo "$HOME/allure/allure-2.27.0/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/allure/allure-2.27.0/bin:$PATH"
          fi
          allure --version

      - name: Generate Allure HTML report
        shell: bash
        env:
          REPORT_TITLE: ${{ inputs.report_title }}
        run: |
          set -euo pipefail
          export PATH="$HOME/allure/allure-2.27.0/bin:$PATH"
          allure generate allure-results \
            --output allure-html \
            --clean
          echo "::notice::Allure report generated at allure-html/ (${REPORT_TITLE})"

      - name: Push report to gh-pages
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAGES_BRANCH: gh-pages
          REPORT_BASE_PATH: allure-report
          MAX_HISTORY: '20'
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: bash platform/.github/actions/publish-allure/push-report.sh

      - name: Write Allure step summary
        shell: bash
        run: |
          {
            echo "### Allure Report Published"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Run ID | \`${{ github.run_id }}\` |"
            echo "| Report URL | [${{ steps.publish.outputs.report_url }}](${{ steps.publish.outputs.report_url }}) |"
            echo "| Max history kept | 20 runs |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parse test summary stats
        id: summary
        shell: bash
        env:
          TEST_TAGS: ${{ inputs.test_tags }}
          REPORT_URL: ${{ steps.publish.outputs.report_url }}
          SUMMARY_JSON: allure-html/widgets/summary.json
        run: bash platform/.github/actions/parse-allure-summary/parse-allure-summary.sh

  gate:
    name: Test result gate
    needs: [discover, execute, report]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.gate.outputs.tests_passed }}

    steps:
      - name: Resolve platform checkout
        id: platform_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          repo="${GITHUB_WORKFLOW_REF%@*}"
          repo="${repo%%/.github/workflows/*}"
          if [[ -z "$ref" || -z "$repo" || "$repo" == "$GITHUB_WORKFLOW_REF" ]]; then
            echo "::error::Could not parse the platform repository from GITHUB_WORKFLOW_REF."
            exit 1
          fi
          {
            echo "ref=$ref"
            echo "repository=$repo"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout platform repository
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.platform_ref.outputs.repository }}
          ref: ${{ steps.platform_ref.outputs.ref }}
          token: ${{ github.token }}
          path: platform
          persist-credentials: false

      - name: Evaluate gate
        id: gate
        shell: bash
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          EXECUTE_RESULT: ${{ needs.execute.result }}
          REPORT_RESULT: ${{ needs.report.result }}
          TOTAL: ${{ needs.report.outputs.total_tests }}
          FAILED: ${{ needs.report.outputs.failed_tests }}
          BROKEN: ${{ needs.report.outputs.broken_tests }}
        run: bash platform/.github/actions/evaluate-test-gate/evaluate-test-gate.sh
