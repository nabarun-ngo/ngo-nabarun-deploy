name: Reusable — Setup Context

on:
  workflow_call:
    inputs:
      manifest_name:
        description: Manifest name (filename without .json) to deploy.
        type: string
        required: false
        default: ''
      target_environment:
        description: Logical environment (stage | prod).
        type: string
        required: false
        default: 'stage'
      tag_name:
        description: Git tag to deploy. Pass 'latest' to auto-resolve from target branch.
        type: string
        required: false
        default: 'latest'
      workflow_type:
        description: 'deploy | tests — used for environment routing.'
        type: string
        required: false
        default: 'deploy'
      schedule_profile_id:
        description: >
          ID from config/schedules/tests.json (only set when triggered by cron).
          Overrides manifest_name and target_environment when provided.
        type: string
        required: false
        default: ''

    outputs:
      trigger_type:
        description: How this workflow was triggered (schedule | workflow_dispatch | repository_dispatch).
        value: ${{ jobs.setup.outputs.trigger_type }}
      manifest_name:
        description: Resolved manifest name.
        value: ${{ jobs.setup.outputs.manifest_name }}
      target_environment:
        description: Resolved logical environment.
        value: ${{ jobs.setup.outputs.target_environment }}
      tag_name:
        description: Resolved tag name (may be 'latest').
        value: ${{ jobs.setup.outputs.tag_name }}
      approval_mode:
        description: '"auto" for scheduled runs, "manual" for dispatch/manual runs.'
        value: ${{ jobs.setup.outputs.approval_mode }}
      workflow_type:
        description: 'deploy | tests'
        value: ${{ jobs.setup.outputs.workflow_type }}

permissions:
  contents: read

jobs:
  setup:
    name: Resolve workflow context
    runs-on: ubuntu-latest
    outputs:
      trigger_type: ${{ steps.ctx.outputs.trigger_type }}
      manifest_name: ${{ steps.ctx.outputs.manifest_name }}
      target_environment: ${{ steps.ctx.outputs.target_environment }}
      tag_name: ${{ steps.ctx.outputs.tag_name }}
      approval_mode: ${{ steps.ctx.outputs.approval_mode }}
      workflow_type: ${{ steps.ctx.outputs.workflow_type }}

    steps:
      - name: Log run context
        env:
          LOG_TITLE: Setup context
          LOG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          echo "::notice::${LOG_TITLE} — ${GITHUB_EVENT_NAME} run=${GITHUB_RUN_ID}"
          echo "::group::${LOG_TITLE} context"
          echo "event=${GITHUB_EVENT_NAME} ref=${GITHUB_REF} sha=${GITHUB_SHA}"
          echo "job=${GITHUB_JOB} actor=${GITHUB_ACTOR}"
          echo "${LOG_INPUTS}"
          echo "::endgroup::"

      - name: Resolve context
        id: ctx
        uses: ./.github/actions/resolve-workflow-context
        with:
          event_name: ${{ github.event_name }}
          manifest_name: ${{ inputs.manifest_name }}
          target_environment: ${{ inputs.target_environment }}
          tag_name: ${{ inputs.tag_name }}
          workflow_type: ${{ inputs.workflow_type }}
          dispatch_manifest: ${{ github.event.client_payload.manifest_name }}
          dispatch_tag: ${{ github.event.client_payload.tag_name }}
          dispatch_environment: ${{ github.event.client_payload.target_environment }}

      - name: Write step summary
        shell: bash
        run: |
          {
            echo "### Workflow Context"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Trigger | \`${{ steps.ctx.outputs.trigger_type }}\` |"
            echo "| Approval mode | \`${{ steps.ctx.outputs.approval_mode }}\` |"
            echo "| Manifest | \`${{ steps.ctx.outputs.manifest_name }}\` |"
            echo "| Target environment | \`${{ steps.ctx.outputs.target_environment }}\` |"
            echo "| Tag | \`${{ steps.ctx.outputs.tag_name }}\` |"
            echo "| Workflow type | \`${{ steps.ctx.outputs.workflow_type }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
